<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texas Cash Five Bottom-Up 40 Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f6f8;
  color:#18222d;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:24px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  margin:0 0 20px;
  font-size:14px;
  color:#4b5968;
}

.panel{
  background:#ffffff;
  border:1px solid #d8dee5;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

textarea{
  width:100%;
  min-height:340px;
  padding:12px;
  resize:vertical;
  font-family:Consolas, monospace;
  font-size:13px;
  line-height:1.45;
  border:1px solid #aeb8c2;
  border-radius:8px;
}

.controls{
  text-align:center;
  margin:16px 0 8px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  margin:5px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.generate{
  background:#164f86;
  color:white;
}

.copy{
  background:#2f6b3a;
  color:white;
}

.print{
  background:#6a4c7d;
  color:white;
}

.clear{
  background:#6e747b;
  color:white;
}

#status{
  text-align:center;
  margin-top:12px;
  font-weight:700;
  min-height:22px;
}

#latest{
  text-align:center;
  margin-top:10px;
  font-size:15px;
  font-weight:700;
}

#results{
  display:none;
  margin-top:20px;
}

.ticket-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:8px 16px;
  margin-top:14px;
}

.ticket{
  background:#fafbfc;
  border:1px solid #d8dee5;
  border-radius:8px;
  padding:10px 12px;
  font-family:Consolas, monospace;
  font-size:17px;
  font-weight:700;
}

@media(max-width:650px){
  .ticket-grid{
    grid-template-columns:1fr;
  }
}

@media print{
  body{
    background:white;
  }

  .input-area,
  .controls,
  #status,
  .subtitle{
    display:none !important;
  }

  .panel{
    border:0;
    box-shadow:none;
    padding:0;
  }

  #results{
    display:block !important;
  }

  .ticket-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>
<div class="container">

  <h1>Texas Cash Five 40 Generator</h1>
  <div class="subtitle">
    Paste newest draw at the top and oldest draw at the bottom.
    The program reads history from the bottom upward.
  </div>

  <div class="panel">

    <div class="input-area">
      <textarea id="dataInput" placeholder="Paste Cash Five drawing history here.

Example:

09/05/2026   5 - 10 - 13 - 19 - 20
09/04/2026   10 - 11 - 12 - 15 - 20
09/03/2026   5 - 9 - 11 - 13 - 28
...
03/11/2026   1 - 5 - 15 - 21 - 31

FIRST ROW = latest/current draw
BOTTOM ROW = oldest draw"></textarea>
    </div>

    <div class="controls">
      <button class="generate" onclick="generate40()">Generate 40 Numbers</button>
      <button class="copy" onclick="copyNumbers()">Copy Numbers</button>
      <button class="print" onclick="window.print()">Print Numbers</button>
      <button class="clear" onclick="clearAll()">Clear</button>
    </div>

    <div id="status"></div>
    <div id="latest"></div>

    <div id="results">
      <div class="ticket-grid" id="ticketGrid"></div>
    </div>

  </div>
</div>

<script>
let generatedTickets = [];

/* =========================================================
   1. PARSE THE PASTED DATA
   ---------------------------------------------------------
   The first valid row is treated as the latest/current draw.
   The last valid row is the oldest draw.
   ========================================================= */

function parseDraws(text){

  const lines = text.split(/\r?\n/);
  const draws = [];

  for(const line of lines){

    const match = line.match(
      /\b(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\b/
    );

    if(!match) continue;

    const nums = match.slice(1,6).map(Number);

    if(nums.some(n => n < 1 || n > 35)) continue;

    if(new Set(nums).size !== 5) continue;

    draws.push(nums);
  }

  return draws;
}


/* =========================================================
   2. BUILD BOTTOM-UP FOLLOWER HISTORY
   ---------------------------------------------------------
   User pastes:
       newest
       ...
       oldest

   For analysis, we reverse to:
       oldest
       ...
       newest

   If current/latest P1 = 05, we find earlier occurrences of
   05 in P1 and record the number that appeared in P1 on the
   NEXT chronological drawing.

   Same for P2, P3, P4, P5.
   ========================================================= */

function buildFollowerCounters(pastedDraws){

  const chronological = [...pastedDraws].reverse();
  const current = pastedDraws[0];

  const counters = Array.from({length:5}, () => new Map());

  for(let position=0; position<5; position++){

    const target = current[position];

    for(let i=0; i<chronological.length-1; i++){

      if(chronological[i][position] === target){

        const follower = chronological[i+1][position];

        counters[position].set(
          follower,
          (counters[position].get(follower) || 0) + 1
        );
      }
    }
  }

  return { current, counters };
}


/* =========================================================
   3. CONVERT EACH POSITION'S FOLLOWER FREQUENCY TO 40 SLOTS
   ---------------------------------------------------------
   Example:
   04 occurred most often after current P1 value.
   It receives more of the 40 placements.

   Largest-remainder allocation is used so every row totals
   exactly 40 placements.

   Every observed follower is kept when possible.
   ========================================================= */

function allocateForty(counter){

  const items = [...counter.entries()];

  if(items.length === 0) return null;

  const totalObservations =
    items.reduce((sum,[num,count]) => sum + count, 0);

  const rows = items.map(([num,count]) => ({
    num,
    count,
    raw: (40 * count) / totalObservations,
    floor: Math.floor((40 * count) / totalObservations)
  }));

  const quota = new Map();

  for(const r of rows){
    quota.set(r.num, r.floor);
  }

  let used =
    [...quota.values()].reduce((sum,v) => sum + v, 0);

  const remainderOrder = [...rows].sort((a,b) => {
    const ar = a.raw - Math.floor(a.raw);
    const br = b.raw - Math.floor(b.raw);

    return (
      br - ar ||
      b.count - a.count ||
      a.num - b.num
    );
  });

  let index = 0;

  while(used < 40){

    const r =
      remainderOrder[index % remainderOrder.length];

    quota.set(
      r.num,
      (quota.get(r.num) || 0) + 1
    );

    used++;
    index++;
  }

  /* Make sure one-time / low-frequency observed followers
     are not silently removed. */

  for(const r of rows){

    if((quota.get(r.num) || 0) === 0){

      const donors =
        [...quota.entries()]
        .filter(([num,count]) => num !== r.num && count > 1)
        .sort((a,b) => b[1]-a[1] || a[0]-b[0]);

      if(donors.length){

        const [donorNum, donorCount] = donors[0];

        quota.set(donorNum, donorCount-1);
        quota.set(r.num,1);
      }
    }
  }

  return quota;
}


/* =========================================================
   4. MERGE THE FIVE ROW QUOTAS
   ---------------------------------------------------------
   Each of 5 positions contributes 40 placements:
       5 x 40 = 200 placements

   Final tickets are NOT forced to use one number from each
   original row.

   Any qualified follower may combine with any other.
   ========================================================= */

function mergeQuotas(rowQuotas){

  const merged = new Map();

  for(const quota of rowQuotas){

    for(const [num,count] of quota){

      merged.set(
        num,
        (merged.get(num) || 0) + count
      );
    }
  }

  return merged;
}


/* =========================================================
   5. DETERMINISTIC RANDOM GENERATOR
   ---------------------------------------------------------
   The same pasted history produces the same base wheel.
   ========================================================= */

function makeRandom(seed){

  let state = seed >>> 0;

  return function(){

    state =
      (Math.imul(state,1664525) + 1013904223) >>> 0;

    return state / 4294967296;
  };
}

function makeSeed(draws){

  let hash = 2166136261 >>> 0;

  for(const draw of draws){

    for(const n of draw){

      hash ^= n;
      hash = Math.imul(hash,16777619) >>> 0;
    }
  }

  return hash >>> 0;
}


/* =========================================================
   6. EXACT 40-TICKET CONSTRUCTION
   ---------------------------------------------------------
   Requirements:
   - exactly 40 tickets
   - exactly 5 numbers each
   - no duplicate number inside a ticket
   - no duplicate full ticket
   - preserve merged quota exactly when mathematically possible
   - reduce repeated number-pairing where possible
   ========================================================= */

function buildExactWheel(globalQuota, seed){

  const entries = [...globalQuota.entries()];

  const total =
    entries.reduce((sum,[num,count]) => sum + count, 0);

  if(total !== 200) return null;

  /* A number cannot appear more than once on any ticket.
     Therefore no number can have quota > 40. */

  if(entries.some(([num,count]) => count > 40)){
    return null;
  }

  for(let attempt=0; attempt<500; attempt++){

    const random =
      makeRandom((seed + attempt*104729) >>> 0);

    const tickets =
      Array.from({length:40}, () => []);

    const pairUsage = new Map();

    const work =
      [...entries].sort((a,b) =>
        b[1]-a[1] ||
        a[0]-b[0]
      );

    let failed = false;

    for(const [number,count] of work){

      const candidates = [];

      for(let i=0; i<40; i++){

        const ticket = tickets[i];

        if(ticket.length >= 5) continue;
        if(ticket.includes(number)) continue;

        let pairPenalty = 0;

        for(const other of ticket){

          const key =
            number < other
              ? number + "-" + other
              : other + "-" + number;

          pairPenalty += pairUsage.get(key) || 0;
        }

        candidates.push({
          index:i,
          fill:ticket.length,
          pairPenalty,
          random:random()
        });
      }

      candidates.sort((a,b) =>
        a.pairPenalty - b.pairPenalty ||
        a.fill - b.fill ||
        a.random - b.random
      );

      if(candidates.length < count){
        failed = true;
        break;
      }

      for(let j=0; j<count; j++){

        const ticketIndex = candidates[j].index;
        const ticket = tickets[ticketIndex];

        for(const other of ticket){

          const key =
            number < other
              ? number + "-" + other
              : other + "-" + number;

          pairUsage.set(
            key,
            (pairUsage.get(key) || 0) + 1
          );
        }

        ticket.push(number);
      }
    }

    if(failed) continue;

    if(
      !tickets.every(
        t =>
          t.length === 5 &&
          new Set(t).size === 5
      )
    ){
      continue;
    }

    const sortedTickets =
      tickets.map(
        t => [...t].sort((a,b) => a-b)
      );

    const keys =
      sortedTickets.map(t => t.join("-"));

    if(new Set(keys).size !== 40){
      continue;
    }

    return sortedTickets;
  }

  return null;
}


/* =========================================================
   7. WEIGHTED FALLBACK
   ---------------------------------------------------------
   Sometimes the merged history creates a quota impossible
   to place exactly across only 40 unique tickets.

   In that case:
   - keep only qualified follower numbers
   - keep historical weights
   - generate 40 unique weighted combinations
   ========================================================= */

function buildWeightedWheel(globalQuota, seed){

  const random =
    makeRandom(seed ^ 0x9e3779b9);

  const numbers =
    [...globalQuota.keys()];

  if(numbers.length < 5){
    return null;
  }

  const ticketSet = new Set();
  const tickets = [];

  function chooseNumber(excluded){

    const eligible =
      numbers.filter(n => !excluded.has(n));

    if(eligible.length === 0){
      return null;
    }

    const totalWeight =
      eligible.reduce(
        (sum,n) => sum + globalQuota.get(n),
        0
      );

    let r = random() * totalWeight;

    for(const n of eligible){

      r -= globalQuota.get(n);

      if(r <= 0){
        return n;
      }
    }

    return eligible[eligible.length-1];
  }

  let guard = 0;

  while(
    tickets.length < 40 &&
    guard < 100000
  ){

    guard++;

    const chosen = new Set();

    while(chosen.size < 5){

      const n = chooseNumber(chosen);

      if(n === null) break;

      chosen.add(n);
    }

    if(chosen.size !== 5) continue;

    const ticket =
      [...chosen].sort((a,b) => a-b);

    const key = ticket.join("-");

    if(ticketSet.has(key)) continue;

    ticketSet.add(key);
    tickets.push(ticket);
  }

  return tickets.length === 40
    ? tickets
    : null;
}


/* =========================================================
   8. GENERATE
   ========================================================= */

function generate40(){

  const status =
    document.getElementById("status");

  const latest =
    document.getElementById("latest");

  const results =
    document.getElementById("results");

  const grid =
    document.getElementById("ticketGrid");

  status.textContent = "";
  latest.textContent = "";
  results.style.display = "none";
  grid.innerHTML = "";
  generatedTickets = [];

  const text =
    document.getElementById("dataInput").value;

  const draws = parseDraws(text);

  if(draws.length < 2){

    status.textContent =
      "Paste at least two valid Cash Five drawings.";

    return;
  }

  const {current,counters} =
    buildFollowerCounters(draws);

  latest.textContent =
    "Latest Draw: " +
    current.map(formatNumber).join(" - ");

  const missingPositions = [];

  counters.forEach((counter,index) => {
    if(counter.size === 0){
      missingPositions.push(index+1);
    }
  });

  if(missingPositions.length){

    status.textContent =
      "Not enough historical follower data for row(s): " +
      missingPositions.join(", ") +
      ". Paste more previous drawings.";

    return;
  }

  const rowQuotas =
    counters.map(allocateForty);

  const globalQuota =
    mergeQuotas(rowQuotas);

  const seed =
    makeSeed(draws);

  let wheel =
    buildExactWheel(globalQuota,seed);

  let mode = "Exact follower-weight wheel";

  if(!wheel){

    wheel =
      buildWeightedWheel(globalQuota,seed);

    mode =
      "Weighted follower wheel";
  }

  if(!wheel){

    status.textContent =
      "Could not create 40 unique tickets from the pasted history.";

    return;
  }

  generatedTickets = wheel;

  grid.innerHTML =
    wheel.map((ticket,index) => {

      const number =
        String(index+1).padStart(2,"0");

      return `
        <div class="ticket">
          ${number}. ${ticket.map(formatNumber).join(" - ")}
        </div>
      `;
    }).join("");

  results.style.display = "block";

  status.textContent =
    "40 tickets generated — " + mode + ".";
}


/* =========================================================
   9. COPY
   ========================================================= */

function copyNumbers(){

  if(generatedTickets.length !== 40){

    document.getElementById("status").textContent =
      "Generate the 40 numbers first.";

    return;
  }

  const text =
    generatedTickets
      .map((ticket,index) => {

        const number =
          String(index+1).padStart(2,"0");

        return (
          number +
          ". " +
          ticket.map(formatNumber).join(" - ")
        );
      })
      .join("\n");

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard.writeText(text)
      .then(() => {
        document.getElementById("status").textContent =
          "40 numbers copied.";
      })
      .catch(() => fallbackCopy(text));

  }else{

    fallbackCopy(text);
  }
}

function fallbackCopy(text){

  const box =
    document.createElement("textarea");

  box.value = text;

  document.body.appendChild(box);

  box.select();

  document.execCommand("copy");

  box.remove();

  document.getElementById("status").textContent =
    "40 numbers copied.";
}


/* =========================================================
   10. CLEAR
   ========================================================= */

function clearAll(){

  document.getElementById("dataInput").value = "";
  document.getElementById("status").textContent = "";
  document.getElementById("latest").textContent = "";
  document.getElementById("ticketGrid").innerHTML = "";
  document.getElementById("results").style.display = "none";

  generatedTickets = [];
}


/* =========================================================
   UTILITIES
   ========================================================= */

function formatNumber(n){
  return String(n).padStart(2,"0");
}
</script>

</body>
</html>
