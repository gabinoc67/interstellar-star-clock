<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotto Texas Bottom-Up 40 Generator</title>

<style>
:root{
  --page:#f5f7fa;
  --card:#ffffff;
  --text:#1d2733;
  --muted:#62707f;
  --border:#d8dee6;
  --primary:#15558d;
  --primary-dark:#104572;
  --success:#2f6d3d;
  --print:#6c4f7f;
  --neutral:#6d747c;
  --soft:#f9fbfc;
  --radius:12px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--page);
  color:var(--text);
}

.app{
  width:min(1040px, calc(100% - 32px));
  margin:28px auto;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 8px;
  font-size:30px;
}

.header p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 4px 14px rgba(0,0,0,.05);
  overflow:hidden;
}

.input-section{
  padding:20px;
  border-bottom:1px solid var(--border);
}

textarea{
  width:100%;
  min-height:360px;
  resize:vertical;
  padding:14px;
  border:1px solid #aeb8c4;
  border-radius:10px;
  font:13px/1.5 Consolas, "Courier New", monospace;
  color:var(--text);
  background:#fff;
}

textarea:focus{
  outline:2px solid rgba(21,85,141,.15);
  border-color:var(--primary);
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
}

button{
  border:0;
  border-radius:8px;
  padding:11px 17px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:transform .05s ease, opacity .15s ease;
}

button:active{
  transform:translateY(1px);
}

button:hover{
  opacity:.92;
}

.btn-primary{background:var(--primary);color:#fff}
.btn-copy{background:var(--success);color:#fff}
.btn-print{background:var(--print);color:#fff}
.btn-clear{background:var(--neutral);color:#fff}

.summary{
  padding:14px 20px 6px;
  text-align:center;
}

#status{
  min-height:22px;
  font-weight:700;
}

#latest{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
}

.results{
  display:none;
  padding:12px 20px 22px;
}

.ticket-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px 14px;
}

.ticket{
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--soft);
  font:700 16px/1.35 Consolas, "Courier New", monospace;
  letter-spacing:.2px;
}

@media(max-width:720px){
  .app{
    width:min(100% - 18px,1040px);
    margin:12px auto;
  }

  .ticket-grid{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:25px;
  }
}

@media print{
  body{
    background:#fff;
  }

  .app{
    width:100%;
    margin:0;
  }

  .header p,
  .input-section,
  .actions,
  #status{
    display:none!important;
  }

  .card{
    border:0;
    box-shadow:none;
  }

  .results{
    display:block!important;
    padding:0;
  }

  .summary{
    padding:0 0 12px;
  }

  .ticket-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <h1>Lotto Texas 40 Generator</h1>
    <p>
      Paste the latest drawing first and older drawings underneath it.
      The generator reads the history from the bottom upward and builds 40 weighted Lotto Texas combinations.
    </p>
  </header>

  <section class="card">

    <div class="input-section">
      <textarea id="dataInput" spellcheck="false" placeholder="Paste Lotto Texas drawing history here.

Newest drawing must be the FIRST valid row.
Oldest drawing must be the LAST valid row.

Accepted examples:

09/05/2026 | 05 - 10 - 13 - 19 - 42 - 51
09/03/2026 | 03 - 11 - 18 - 28 - 39 - 51

or

05 - 10 - 13 - 19 - 42 - 51
03 - 11 - 18 - 28 - 39 - 51

The program accepts 6 unique Lotto Texas numbers from 1 through 54 on each valid row."></textarea>
    </div>

    <div class="actions">
      <button class="btn-primary" type="button" onclick="generate40()">Generate 40 Numbers</button>
      <button class="btn-copy" type="button" onclick="copyNumbers()">Copy Numbers</button>
      <button class="btn-print" type="button" onclick="window.print()">Print Numbers</button>
      <button class="btn-clear" type="button" onclick="clearAll()">Clear</button>
    </div>

    <div class="summary">
      <div id="status"></div>
      <div id="latest"></div>
    </div>

    <div class="results" id="results">
      <div class="ticket-grid" id="ticketGrid"></div>
    </div>

  </section>
</main>

<script>
"use strict";

const TICKET_COUNT = 40;
const NUMBERS_PER_TICKET = 6;
const MIN_NUMBER = 1;
const MAX_NUMBER = 54;

let generatedTickets = [];

/* ---------------------------------------------------------
   PARSE DRAW HISTORY
   --------------------------------------------------------- */

function parseDraws(text){
  const draws = [];

  for(const rawLine of text.split(/\r?\n/)){
    const line = rawLine.trim();
    if(!line) continue;

    const hyphenMatch = line.match(
      /(?:^|[^\d])(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})(?:[^\d]|$)/
    );

    let candidate = null;

    if(hyphenMatch){
      candidate = hyphenMatch.slice(1,7).map(Number);
    }else{
      const cleaned = line
        .replace(/\b\d{1,2}\/\d{1,2}\/\d{4}\b/g," ")
        .replace(/\b\d{4}-\d{1,2}-\d{1,2}\b/g," ")
        .replace(/\$[\d,]+(?:\.\d+)?/g," ");

      const values = (cleaned.match(/\b\d{1,2}\b/g) || []).map(Number);

      for(let i=0; i<=values.length-NUMBERS_PER_TICKET; i++){
        const six = values.slice(i,i+NUMBERS_PER_TICKET);

        if(isValidDraw(six)){
          candidate = six;
          break;
        }
      }
    }

    if(!candidate || !isValidDraw(candidate)) continue;

    draws.push([...candidate].sort((a,b)=>a-b));
  }

  return draws;
}

function isValidDraw(nums){
  return (
    nums.length === NUMBERS_PER_TICKET &&
    nums.every(n => Number.isInteger(n) && n >= MIN_NUMBER && n <= MAX_NUMBER) &&
    new Set(nums).size === NUMBERS_PER_TICKET
  );
}


/* ---------------------------------------------------------
   BUILD SAME-POSITION FOLLOWER HISTORY
   --------------------------------------------------------- */

function buildFollowerCounters(pastedDraws){
  const chronological = [...pastedDraws].reverse();
  const current = pastedDraws[0];
  const counters = Array.from({length:NUMBERS_PER_TICKET},()=>new Map());

  for(let pos=0; pos<NUMBERS_PER_TICKET; pos++){
    const target = current[pos];

    for(let i=0; i<chronological.length-1; i++){
      if(chronological[i][pos] !== target) continue;

      const follower = chronological[i+1][pos];

      counters[pos].set(
        follower,
        (counters[pos].get(follower) || 0) + 1
      );
    }
  }

  return {current, chronological, counters};
}


/* ---------------------------------------------------------
   FALLBACK FOR A POSITION WITH NO EXACT HISTORICAL MATCH
   --------------------------------------------------------- */

function fillMissingCounter(counter, chronological, pos, target){
  if(counter.size) return false;

  const observations = [];

  for(let i=0; i<chronological.length-1; i++){
    observations.push({
      distance:Math.abs(chronological[i][pos]-target),
      follower:chronological[i+1][pos]
    });
  }

  if(!observations.length) return false;

  const distances = [...new Set(
    observations.map(x=>x.distance)
  )].sort((a,b)=>a-b);

  const allowedDistances = new Set(distances.slice(0,2));

  for(const item of observations){
    if(!allowedDistances.has(item.distance)) continue;

    const closest = item.distance === distances[0];
    const weight = closest ? 2 : 1;

    counter.set(
      item.follower,
      (counter.get(item.follower) || 0) + weight
    );
  }

  return counter.size > 0;
}


/* ---------------------------------------------------------
   CONVERT EACH POSITION TO 40 WEIGHT SLOTS
   --------------------------------------------------------- */

function allocateSlots(counter){
  const entries = [...counter.entries()];
  if(!entries.length) return null;

  const total = entries.reduce((sum,[,count])=>sum+count,0);

  const rows = entries.map(([num,count])=>{
    const raw = TICKET_COUNT * count / total;

    return {
      num,
      count,
      raw,
      base:Math.floor(raw),
      fraction:raw-Math.floor(raw)
    };
  });

  const quota = new Map(
    rows.map(r=>[r.num,r.base])
  );

  let used = [...quota.values()].reduce((a,b)=>a+b,0);

  rows.sort((a,b)=>
    b.fraction-a.fraction ||
    b.count-a.count ||
    a.num-b.num
  );

  let i=0;

  while(used<TICKET_COUNT){
    const row = rows[i % rows.length];
    quota.set(row.num,(quota.get(row.num)||0)+1);
    used++;
    i++;
  }

  /* Retain low-frequency followers where possible. */
  for(const row of rows){
    if((quota.get(row.num)||0)>0) continue;

    const donor = [...quota.entries()]
      .filter(([n,c])=>n!==row.num && c>1)
      .sort((a,b)=>b[1]-a[1] || a[0]-b[0])[0];

    if(donor){
      quota.set(donor[0],donor[1]-1);
      quota.set(row.num,1);
    }
  }

  return quota;
}

function mergeQuotas(quotas){
  const merged = new Map();

  for(const quota of quotas){
    for(const [num,count] of quota){
      merged.set(
        num,
        (merged.get(num)||0)+count
      );
    }
  }

  return merged;
}


/* ---------------------------------------------------------
   SEEDED RANDOM
   --------------------------------------------------------- */

function makeSeed(draws){
  let hash = 2166136261 >>> 0;

  for(const draw of draws){
    for(const n of draw){
      hash ^= n;
      hash = Math.imul(hash,16777619) >>> 0;
    }
  }

  return hash >>> 0;
}

function makeRandom(seed){
  let state = seed >>> 0;

  return function(){
    state = (
      Math.imul(state,1664525) + 1013904223
    ) >>> 0;

    return state / 4294967296;
  };
}


/* ---------------------------------------------------------
   IMPROVED 40-TICKET GENERATOR

   Goals:
   - high-weight followers appear more often
   - no duplicate number in a ticket
   - no duplicate full ticket
   - spread repeated pairs
   - reduce concentration of the same high-weight numbers
     into the same few tickets
   --------------------------------------------------------- */

function buildTickets(weights, seed){
  const availableNumbers = [...weights.keys()].sort((a,b)=>a-b);

  if(availableNumbers.length < NUMBERS_PER_TICKET){
    return null;
  }

  const random = makeRandom(seed ^ 0x9e3779b9);
  const tickets = [];
  const ticketKeys = new Set();
  const numberUsage = new Map();
  const pairUsage = new Map();

  function getNumberUsage(n){
    return numberUsage.get(n) || 0;
  }

  function getPairUsage(a,b){
    const key = a < b ? `${a}-${b}` : `${b}-${a}`;
    return pairUsage.get(key) || 0;
  }

  function effectiveScore(n, chosen){
    const historicalWeight = weights.get(n) || 0;
    const used = getNumberUsage(n);

    let pairPenalty = 0;

    for(const other of chosen){
      pairPenalty += getPairUsage(n,other);
    }

    /*
      Higher historical weight raises the score.
      Existing number usage and repeated pair usage lower it.
      Tiny random jitter prevents identical deterministic ties.
    */
    return (
      historicalWeight /
      (1 + used*0.32 + pairPenalty*0.7)
    ) * (0.90 + random()*0.20);
  }

  function chooseNext(chosen){
    const candidates = availableNumbers
      .filter(n=>!chosen.includes(n))
      .map(n=>({
        n,
        score:effectiveScore(n,chosen)
      }))
      .sort((a,b)=>
        b.score-a.score ||
        a.n-b.n
      );

    if(!candidates.length) return null;

    /* Weighted selection from top candidates instead of always taking #1. */
    const top = candidates.slice(0, Math.min(12,candidates.length));
    const total = top.reduce((s,x)=>s+x.score,0);

    let r = random()*total;

    for(const item of top){
      r -= item.score;
      if(r<=0) return item.n;
    }

    return top[top.length-1].n;
  }

  let guard=0;

  while(tickets.length<TICKET_COUNT && guard<250000){
    guard++;

    const chosen=[];

    while(chosen.length<NUMBERS_PER_TICKET){
      const n=chooseNext(chosen);
      if(n===null) break;
      chosen.push(n);
    }

    if(chosen.length!==NUMBERS_PER_TICKET) continue;

    chosen.sort((a,b)=>a-b);
    const key=chosen.join("-");

    if(ticketKeys.has(key)) continue;

    ticketKeys.add(key);
    tickets.push(chosen);

    for(const n of chosen){
      numberUsage.set(n,getNumberUsage(n)+1);
    }

    for(let i=0;i<chosen.length;i++){
      for(let j=i+1;j<chosen.length;j++){
        const a=chosen[i];
        const b=chosen[j];
        const pairKey=`${a}-${b}`;

        pairUsage.set(
          pairKey,
          (pairUsage.get(pairKey)||0)+1
        );
      }
    }
  }

  return tickets.length===TICKET_COUNT ? tickets : null;
}


/* ---------------------------------------------------------
   MAIN GENERATION
   --------------------------------------------------------- */

function generate40(){
  const input = document.getElementById("dataInput");
  const status = document.getElementById("status");
  const latest = document.getElementById("latest");
  const results = document.getElementById("results");
  const grid = document.getElementById("ticketGrid");

  generatedTickets=[];
  status.textContent="";
  latest.textContent="";
  grid.innerHTML="";
  results.style.display="none";

  const draws=parseDraws(input.value);

  if(draws.length<3){
    status.textContent="Paste at least 3 valid Lotto Texas drawing rows.";
    return;
  }

  const data=buildFollowerCounters(draws);
  let fallbackCount=0;

  for(let pos=0;pos<NUMBERS_PER_TICKET;pos++){
    if(data.counters[pos].size===0){
      const filled=fillMissingCounter(
        data.counters[pos],
        data.chronological,
        pos,
        data.current[pos]
      );

      if(filled) fallbackCount++;
    }
  }

  if(data.counters.some(c=>c.size===0)){
    status.textContent="Not enough usable history to build all six Lotto Texas positions.";
    return;
  }

  const quotas=data.counters.map(allocateSlots);

  if(quotas.some(q=>!q)){
    status.textContent="Could not calculate follower weights from this history.";
    return;
  }

  const merged=mergeQuotas(quotas);
  const tickets=buildTickets(merged,makeSeed(draws));

  if(!tickets){
    status.textContent="Could not build 40 unique Lotto Texas tickets from this history.";
    return;
  }

  generatedTickets=tickets;

  latest.textContent=
    "Latest Draw: " +
    data.current.map(formatNumber).join(" - ");

  grid.innerHTML=tickets.map((ticket,index)=>
    `<div class="ticket">${String(index+1).padStart(2,"0")}. ${ticket.map(formatNumber).join(" - ")}</div>`
  ).join("");

  results.style.display="block";

  status.textContent=
    fallbackCount===0
      ? "40 Lotto Texas tickets generated from exact bottom-up follower history."
      : `40 Lotto Texas tickets generated. ${fallbackCount} position(s) used nearest same-position history because no exact follower existed.`;
}


/* ---------------------------------------------------------
   COPY / CLEAR / UTILITIES
   --------------------------------------------------------- */

function copyNumbers(){
  if(generatedTickets.length!==TICKET_COUNT){
    document.getElementById("status").textContent=
      "Generate the 40 numbers first.";
    return;
  }

  const text=generatedTickets.map((ticket,index)=>
    `${String(index+1).padStart(2,"0")}. ${ticket.map(formatNumber).join(" - ")}`
  ).join("\n");

  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>{
        document.getElementById("status").textContent=
          "40 Lotto Texas numbers copied.";
      })
      .catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const box=document.createElement("textarea");
  box.value=text;
  document.body.appendChild(box);
  box.select();
  document.execCommand("copy");
  box.remove();

  document.getElementById("status").textContent=
    "40 Lotto Texas numbers copied.";
}

function clearAll(){
  document.getElementById("dataInput").value="";
  document.getElementById("status").textContent="";
  document.getElementById("latest").textContent="";
  document.getElementById("ticketGrid").innerHTML="";
  document.getElementById("results").style.display="none";
  generatedTickets=[];
}

function formatNumber(n){
  return String(n).padStart(2,"0");
}
</script>
</body>
</html>
