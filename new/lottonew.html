<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotto Texas Bottom-Up 40 Generator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f6f8;
  color:#18222d;
}

.container{
  max-width:1050px;
  margin:0 auto;
  padding:24px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  margin:0 0 20px;
  font-size:14px;
  color:#4b5968;
}

.panel{
  background:#fff;
  border:1px solid #d8dee5;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

textarea{
  width:100%;
  min-height:360px;
  padding:12px;
  resize:vertical;
  font-family:Consolas, monospace;
  font-size:13px;
  line-height:1.45;
  border:1px solid #aeb8c2;
  border-radius:8px;
}

.controls{
  text-align:center;
  margin:16px 0 8px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  margin:5px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.generate{background:#164f86;color:#fff}
.copy{background:#2f6b3a;color:#fff}
.print{background:#6a4c7d;color:#fff}
.clear{background:#6e747b;color:#fff}

#status{
  text-align:center;
  margin-top:12px;
  font-weight:700;
  min-height:22px;
}

#latest{
  text-align:center;
  margin-top:10px;
  font-size:15px;
  font-weight:700;
}

#results{
  display:none;
  margin-top:20px;
}

.ticket-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px 16px;
  margin-top:14px;
}

.ticket{
  background:#fafbfc;
  border:1px solid #d8dee5;
  border-radius:8px;
  padding:10px 12px;
  font-family:Consolas, monospace;
  font-size:17px;
  font-weight:700;
}

@media(max-width:700px){
  .ticket-grid{grid-template-columns:1fr}
}

@media print{
  body{background:#fff}
  .input-area,.controls,#status,.subtitle{display:none!important}
  .panel{border:0;box-shadow:none;padding:0}
  #results{display:block!important}
  .ticket-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="container">

  <h1>Lotto Texas 40 Generator</h1>

  <div class="subtitle">
    Paste newest draw at the top and oldest draw at the bottom.
    The program reads the history from the bottom upward.
  </div>

  <div class="panel">

    <div class="input-area">
      <textarea id="dataInput" placeholder="Paste Lotto Texas drawing history here.

Example:

09/05/2026   05 - 10 - 13 - 19 - 20 - 42
09/02/2026   03 - 11 - 18 - 28 - 39 - 51
...
03/11/2026   01 - 08 - 15 - 24 - 36 - 54

FIRST VALID ROW = latest/current draw
BOTTOM VALID ROW = oldest draw

Each row must contain six numbers from 1 to 54."></textarea>
    </div>

    <div class="controls">
      <button class="generate" onclick="generate40()">Generate 40 Numbers</button>
      <button class="copy" onclick="copyNumbers()">Copy Numbers</button>
      <button class="print" onclick="window.print()">Print Numbers</button>
      <button class="clear" onclick="clearAll()">Clear</button>
    </div>

    <div id="status"></div>
    <div id="latest"></div>

    <div id="results">
      <div class="ticket-grid" id="ticketGrid"></div>
    </div>

  </div>
</div>

<script>
let generatedTickets = [];

/* =========================================================
   1. PARSE PASTED LOTTO TEXAS DATA
   ---------------------------------------------------------
   Lotto Texas uses 6 different numbers from 1 to 54.
   FIRST valid pasted row = latest/current draw.
   LAST valid pasted row = oldest draw.
   ========================================================= */

function parseDraws(text){

  const lines = text.split(/\r?\n/);
  const draws = [];

  for(const line of lines){

    const match = line.match(
      /\b(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\b/
    );

    if(!match) continue;

    const nums = match.slice(1,7).map(Number);

    if(nums.some(n => n < 1 || n > 54)) continue;

    if(new Set(nums).size !== 6) continue;

    draws.push(nums);
  }

  return draws;
}


/* =========================================================
   2. BOTTOM-UP FOLLOWER METHOD
   ---------------------------------------------------------
   Pasted order:
       newest
       ...
       oldest

   Analysis order:
       oldest
       ...
       newest

   For each of the 6 sorted positions, use the value in the
   latest/current draw as the target. Every time that same
   value appeared historically in that same position, record
   what number appeared in that position on the NEXT draw.
   ========================================================= */

function buildFollowerCounters(pastedDraws){

  const chronological = [...pastedDraws].reverse();
  const current = pastedDraws[0];

  const counters = Array.from({length:6}, () => new Map());

  for(let position=0; position<6; position++){

    const target = current[position];

    for(let i=0; i<chronological.length-1; i++){

      if(chronological[i][position] === target){

        const follower = chronological[i+1][position];

        counters[position].set(
          follower,
          (counters[position].get(follower) || 0) + 1
        );
      }
    }
  }

  return {current,counters};
}


/* =========================================================
   3. ALLOCATE EACH POSITION TO 40 PLACEMENTS
   ---------------------------------------------------------
   Historical follower frequency is converted into exactly
   40 placements for each position using largest remainder.
   Every observed follower is retained when possible.
   ========================================================= */

function allocateForty(counter){

  const items = [...counter.entries()];

  if(items.length === 0) return null;

  const totalObservations =
    items.reduce((sum,[num,count]) => sum + count,0);

  const rows = items.map(([num,count]) => ({
    num,
    count,
    raw:(40 * count) / totalObservations,
    floor:Math.floor((40 * count) / totalObservations)
  }));

  const quota = new Map();

  for(const row of rows){
    quota.set(row.num,row.floor);
  }

  let used =
    [...quota.values()].reduce((sum,v) => sum + v,0);

  const remainderOrder = [...rows].sort((a,b) => {

    const ar = a.raw - Math.floor(a.raw);
    const br = b.raw - Math.floor(b.raw);

    return (
      br-ar ||
      b.count-a.count ||
      a.num-b.num
    );
  });

  let i = 0;

  while(used < 40){

    const row =
      remainderOrder[i % remainderOrder.length];

    quota.set(
      row.num,
      (quota.get(row.num) || 0) + 1
    );

    used++;
    i++;
  }

  /* Keep any observed follower that rounded to zero. */
  for(const row of rows){

    if((quota.get(row.num) || 0) === 0){

      const donors =
        [...quota.entries()]
        .filter(([num,count]) =>
          num !== row.num && count > 1
        )
        .sort((a,b) =>
          b[1]-a[1] || a[0]-b[0]
        );

      if(donors.length){

        const [donorNum,donorCount] = donors[0];

        quota.set(donorNum,donorCount-1);
        quota.set(row.num,1);
      }
    }
  }

  return quota;
}


/* =========================================================
   4. MERGE SIX POSITION QUOTAS
   ---------------------------------------------------------
   6 positions x 40 placements = 240 total placements.

   Final Lotto Texas tickets may combine ANY qualified
   follower numbers. They are not forced to use one number
   from each original position.
   ========================================================= */

function mergeQuotas(rowQuotas){

  const merged = new Map();

  for(const quota of rowQuotas){

    for(const [num,count] of quota){

      merged.set(
        num,
        (merged.get(num) || 0) + count
      );
    }
  }

  return merged;
}


/* =========================================================
   5. DETERMINISTIC RANDOM
   ========================================================= */

function makeRandom(seed){

  let state = seed >>> 0;

  return function(){

    state =
      (Math.imul(state,1664525) + 1013904223) >>> 0;

    return state / 4294967296;
  };
}

function makeSeed(draws){

  let hash = 2166136261 >>> 0;

  for(const draw of draws){

    for(const n of draw){

      hash ^= n;
      hash = Math.imul(hash,16777619) >>> 0;
    }
  }

  return hash >>> 0;
}


/* =========================================================
   6. EXACT 40-TICKET WHEEL
   ---------------------------------------------------------
   Requirements:
   - exactly 40 tickets
   - exactly 6 numbers per ticket
   - numbers from 1 to 54
   - no repeated number inside a ticket
   - no duplicate full ticket
   - preserve merged historical placement quotas exactly,
     when mathematically possible
   - reduce repeated number pairs where possible
   ========================================================= */

function buildExactWheel(globalQuota,seed){

  const entries = [...globalQuota.entries()];

  const total =
    entries.reduce((sum,[num,count]) => sum + count,0);

  if(total !== 240) return null;

  /* One number can appear at most once per ticket, so a
     number cannot have more than 40 placements. */
  if(entries.some(([num,count]) => count > 40)){
    return null;
  }

  for(let attempt=0; attempt<800; attempt++){

    const random =
      makeRandom((seed + attempt*104729) >>> 0);

    const tickets =
      Array.from({length:40},() => []);

    const pairUsage = new Map();

    const work =
      [...entries].sort((a,b) =>
        b[1]-a[1] || a[0]-b[0]
      );

    let failed = false;

    for(const [number,count] of work){

      const candidates = [];

      for(let i=0; i<40; i++){

        const ticket = tickets[i];

        if(ticket.length >= 6) continue;
        if(ticket.includes(number)) continue;

        let pairPenalty = 0;

        for(const other of ticket){

          const key =
            number < other
              ? number + "-" + other
              : other + "-" + number;

          pairPenalty += pairUsage.get(key) || 0;
        }

        candidates.push({
          index:i,
          fill:ticket.length,
          pairPenalty,
          random:random()
        });
      }

      candidates.sort((a,b) =>
        a.pairPenalty-b.pairPenalty ||
        a.fill-b.fill ||
        a.random-b.random
      );

      if(candidates.length < count){
        failed = true;
        break;
      }

      for(let j=0; j<count; j++){

        const ticketIndex =
          candidates[j].index;

        const ticket =
          tickets[ticketIndex];

        for(const other of ticket){

          const key =
            number < other
              ? number + "-" + other
              : other + "-" + number;

          pairUsage.set(
            key,
            (pairUsage.get(key) || 0) + 1
          );
        }

        ticket.push(number);
      }
    }

    if(failed) continue;

    if(
      !tickets.every(t =>
        t.length === 6 &&
        new Set(t).size === 6
      )
    ){
      continue;
    }

    const sortedTickets =
      tickets.map(t =>
        [...t].sort((a,b) => a-b)
      );

    const keys =
      sortedTickets.map(t => t.join("-"));

    if(new Set(keys).size !== 40){
      continue;
    }

    return sortedTickets;
  }

  return null;
}


/* =========================================================
   7. WEIGHTED FALLBACK
   ---------------------------------------------------------
   If exact merged quotas cannot fit into 40 valid tickets,
   create 40 unique weighted tickets using only qualified
   follower numbers.
   ========================================================= */

function buildWeightedWheel(globalQuota,seed){

  const random =
    makeRandom(seed ^ 0x9e3779b9);

  const numbers =
    [...globalQuota.keys()];

  if(numbers.length < 6){
    return null;
  }

  const ticketSet = new Set();
  const tickets = [];

  function chooseNumber(excluded){

    const eligible =
      numbers.filter(n => !excluded.has(n));

    if(eligible.length === 0){
      return null;
    }

    const totalWeight =
      eligible.reduce(
        (sum,n) => sum + globalQuota.get(n),
        0
      );

    let r = random() * totalWeight;

    for(const n of eligible){

      r -= globalQuota.get(n);

      if(r <= 0){
        return n;
      }
    }

    return eligible[eligible.length-1];
  }

  let guard = 0;

  while(
    tickets.length < 40 &&
    guard < 150000
  ){

    guard++;

    const chosen = new Set();

    while(chosen.size < 6){

      const n = chooseNumber(chosen);

      if(n === null) break;

      chosen.add(n);
    }

    if(chosen.size !== 6) continue;

    const ticket =
      [...chosen].sort((a,b) => a-b);

    const key = ticket.join("-");

    if(ticketSet.has(key)) continue;

    ticketSet.add(key);
    tickets.push(ticket);
  }

  return tickets.length === 40
    ? tickets
    : null;
}


/* =========================================================
   8. GENERATE 40 LOTTO TEXAS TICKETS
   ========================================================= */

function generate40(){

  const status =
    document.getElementById("status");

  const latest =
    document.getElementById("latest");

  const results =
    document.getElementById("results");

  const grid =
    document.getElementById("ticketGrid");

  status.textContent = "";
  latest.textContent = "";
  results.style.display = "none";
  grid.innerHTML = "";
  generatedTickets = [];

  const text =
    document.getElementById("dataInput").value;

  const draws =
    parseDraws(text);

  if(draws.length < 2){

    status.textContent =
      "Paste at least two valid Lotto Texas drawings.";

    return;
  }

  const {current,counters} =
    buildFollowerCounters(draws);

  latest.textContent =
    "Latest Draw: " +
    current.map(formatNumber).join(" - ");

  const missing = [];

  counters.forEach((counter,index) => {

    if(counter.size === 0){
      missing.push(index+1);
    }
  });

  if(missing.length){

    status.textContent =
      "Not enough historical follower data for row(s): " +
      missing.join(", ") +
      ". Paste more previous Lotto Texas drawings.";

    return;
  }

  const rowQuotas =
    counters.map(allocateForty);

  const globalQuota =
    mergeQuotas(rowQuotas);

  const seed =
    makeSeed(draws);

  let wheel =
    buildExactWheel(globalQuota,seed);

  let mode =
    "Exact follower-weight wheel";

  if(!wheel){

    wheel =
      buildWeightedWheel(globalQuota,seed);

    mode =
      "Weighted follower wheel";
  }

  if(!wheel){

    status.textContent =
      "Could not create 40 unique Lotto Texas tickets from the pasted history.";

    return;
  }

  generatedTickets = wheel;

  grid.innerHTML =
    wheel.map((ticket,index) => {

      const number =
        String(index+1).padStart(2,"0");

      return `
        <div class="ticket">
          ${number}. ${ticket.map(formatNumber).join(" - ")}
        </div>
      `;
    }).join("");

  results.style.display = "block";

  status.textContent =
    "40 Lotto Texas tickets generated — " + mode + ".";
}


/* =========================================================
   9. COPY
   ========================================================= */

function copyNumbers(){

  if(generatedTickets.length !== 40){

    document.getElementById("status").textContent =
      "Generate the 40 numbers first.";

    return;
  }

  const text =
    generatedTickets
      .map((ticket,index) => {

        const number =
          String(index+1).padStart(2,"0");

        return (
          number +
          ". " +
          ticket.map(formatNumber).join(" - ")
        );
      })
      .join("\n");

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard.writeText(text)
      .then(() => {

        document.getElementById("status").textContent =
          "40 Lotto Texas numbers copied.";

      })
      .catch(() => fallbackCopy(text));

  }else{

    fallbackCopy(text);
  }
}

function fallbackCopy(text){

  const box =
    document.createElement("textarea");

  box.value = text;

  document.body.appendChild(box);

  box.select();

  document.execCommand("copy");

  box.remove();

  document.getElementById("status").textContent =
    "40 Lotto Texas numbers copied.";
}


/* =========================================================
   10. CLEAR
   ========================================================= */

function clearAll(){

  document.getElementById("dataInput").value = "";
  document.getElementById("status").textContent = "";
  document.getElementById("latest").textContent = "";
  document.getElementById("ticketGrid").innerHTML = "";
  document.getElementById("results").style.display = "none";

  generatedTickets = [];
}


/* =========================================================
   UTILITIES
   ========================================================= */

function formatNumber(n){
  return String(n).padStart(2,"0");
}
</script>

</body>
</html>
