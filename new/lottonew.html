<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotto Texas Bottom-Up 40 Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#18222d}
.container{max-width:1000px;margin:0 auto;padding:24px}
h1{text-align:center;margin:0 0 8px;font-size:30px}
.subtitle{text-align:center;margin:0 0 20px;color:#4b5968;font-size:14px}
.panel{background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:20px;box-shadow:0 3px 10px rgba(0,0,0,.05)}
textarea{width:100%;min-height:360px;padding:12px;resize:vertical;font-family:Consolas,monospace;font-size:13px;line-height:1.45;border:1px solid #aeb8c2;border-radius:8px}
.controls{text-align:center;margin:16px 0 8px}
button{border:0;border-radius:8px;padding:12px 18px;margin:5px;font-size:15px;font-weight:700;cursor:pointer}
.generate{background:#164f86;color:white}
.copy{background:#2f6b3a;color:white}
.print{background:#6a4c7d;color:white}
.clear{background:#6e747b;color:white}
#status{text-align:center;margin-top:12px;font-weight:700;min-height:22px}
#latest{text-align:center;margin-top:10px;font-weight:700}
#results{display:none;margin-top:20px}
.ticket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:14px}
.ticket{background:#fafbfc;border:1px solid #d8dee5;border-radius:8px;padding:10px 12px;font-family:Consolas,monospace;font-size:17px;font-weight:700}
@media(max-width:700px){.ticket-grid{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .input-area,.controls,#status,.subtitle{display:none!important}
  .panel{border:0;box-shadow:none;padding:0}
  #results{display:block!important}
  .ticket-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="container">
  <h1>Lotto Texas 40 Generator</h1>
  <div class="subtitle">Newest draw at the top. Oldest draw at the bottom. History is analyzed bottom → upward.</div>

  <div class="panel">
    <div class="input-area">
      <textarea id="dataInput" placeholder="Paste Lotto Texas history here.

Accepted examples:
09/05/2026 | 5 - 10 - 13 - 19 - 42 - 51
09/05/2026   5 10 13 19 42 51
5 - 10 - 13 - 19 - 42 - 51

FIRST valid row = latest draw
LAST valid row = oldest draw"></textarea>
    </div>

    <div class="controls">
      <button class="generate" onclick="generate40()">Generate 40 Numbers</button>
      <button class="copy" onclick="copyNumbers()">Copy Numbers</button>
      <button class="print" onclick="window.print()">Print Numbers</button>
      <button class="clear" onclick="clearAll()">Clear</button>
    </div>

    <div id="status"></div>
    <div id="latest"></div>

    <div id="results">
      <div class="ticket-grid" id="ticketGrid"></div>
    </div>
  </div>
</div>

<script>
"use strict";

let generatedTickets = [];

/* ---------- PARSER ---------- */
/* Supports hyphens, commas, spaces, markdown rows, and dates before numbers. */
function parseDraws(text){
  const draws = [];
  const lines = text.split(/\r?\n/);

  for(const rawLine of lines){
    let line = rawLine.trim();
    if(!line) continue;

    /* Prefer a six-number hyphen/comma sequence if present. */
    let m = line.match(
      /(?:^|[^\d])(\d{1,2})\s*[-,]\s*(\d{1,2})\s*[-,]\s*(\d{1,2})\s*[-,]\s*(\d{1,2})\s*[-,]\s*(\d{1,2})\s*[-,]\s*(\d{1,2})(?:[^\d]|$)/
    );

    let nums = null;

    if(m){
      nums = m.slice(1,7).map(Number);
    }else{
      /* Remove common date forms first, then collect standalone integers. */
      let cleaned = line
        .replace(/\b\d{1,2}\/\d{1,2}\/\d{4}\b/g," ")
        .replace(/\b\d{4}-\d{1,2}-\d{1,2}\b/g," ")
        .replace(/\$[\d,]+(?:\.\d+)?/g," ");

      const tokens = cleaned.match(/\b\d{1,2}\b/g);
      if(tokens && tokens.length >= 6){
        /* Find first run of six unique valid Lotto Texas numbers. */
        const vals = tokens.map(Number);
        for(let i=0;i<=vals.length-6;i++){
          const candidate = vals.slice(i,i+6);
          if(candidate.every(n=>n>=1 && n<=54) && new Set(candidate).size===6){
            nums = candidate;
            break;
          }
        }
      }
    }

    if(!nums) continue;
    if(nums.some(n=>n<1 || n>54)) continue;
    if(new Set(nums).size!==6) continue;

    /* Lotto Texas results are treated as six sorted positions. */
    nums = [...nums].sort((a,b)=>a-b);
    draws.push(nums);
  }

  return draws;
}

/* ---------- FOLLOWERS ---------- */
/* Pasted newest -> oldest, analyzed oldest -> newest. */
function buildFollowerCounters(pastedDraws){
  const chronological = [...pastedDraws].reverse();
  const current = pastedDraws[0];
  const counters = Array.from({length:6},()=>new Map());

  for(let pos=0;pos<6;pos++){
    const target = current[pos];

    for(let i=0;i<chronological.length-1;i++){
      if(chronological[i][pos]===target){
        const follower = chronological[i+1][pos];
        counters[pos].set(follower,(counters[pos].get(follower)||0)+1);
      }
    }
  }

  return {chronological,current,counters};
}

/* ---------- SAFE POSITION FALLBACK ---------- */
/*
If a current exact position value has never occurred before,
use the nearest historical values in that SAME sorted position.
This keeps the bottom-up / same-position concept instead of stopping.
*/
function fillMissingFollowerCounter(counter, chronological, pos, target){
  if(counter.size>0) return counter;

  const occurrences = [];

  for(let i=0;i<chronological.length-1;i++){
    const oldValue = chronological[i][pos];
    const follower = chronological[i+1][pos];
    occurrences.push({
      distance:Math.abs(oldValue-target),
      follower
    });
  }

  if(!occurrences.length) return counter;

  occurrences.sort((a,b)=>a.distance-b.distance);

  const bestDistance = occurrences[0].distance;

  /* Use nearest distance, and next distance too if first set is too small. */
  const distinctDistances = [...new Set(occurrences.map(x=>x.distance))].sort((a,b)=>a-b);
  const allowed = new Set(distinctDistances.slice(0,2));

  for(const item of occurrences){
    if(!allowed.has(item.distance)) continue;

    /* Closer historical values get more weight. */
    const weight = item.distance===bestDistance ? 2 : 1;
    counter.set(item.follower,(counter.get(item.follower)||0)+weight);
  }

  return counter;
}

/* ---------- 40-SLOT ALLOCATION ---------- */
function allocateForty(counter){
  const items = [...counter.entries()];
  if(!items.length) return null;

  const total = items.reduce((s,[,c])=>s+c,0);

  const rows = items.map(([num,count])=>{
    const raw = 40*count/total;
    return {num,count,raw,base:Math.floor(raw)};
  });

  const quota = new Map(rows.map(r=>[r.num,r.base]));
  let used = [...quota.values()].reduce((a,b)=>a+b,0);

  rows.sort((a,b)=>
    (b.raw-Math.floor(b.raw))-(a.raw-Math.floor(a.raw)) ||
    b.count-a.count ||
    a.num-b.num
  );

  let i=0;
  while(used<40){
    const r = rows[i%rows.length];
    quota.set(r.num,(quota.get(r.num)||0)+1);
    used++;
    i++;
  }

  /* Preserve every observed follower when possible. */
  for(const r of rows){
    if((quota.get(r.num)||0)!==0) continue;

    const donors = [...quota.entries()]
      .filter(([n,c])=>n!==r.num && c>1)
      .sort((a,b)=>b[1]-a[1] || a[0]-b[0]);

    if(donors.length){
      quota.set(donors[0][0],donors[0][1]-1);
      quota.set(r.num,1);
    }
  }

  return quota;
}

function mergeQuotas(quotas){
  const merged = new Map();
  for(const q of quotas){
    for(const [n,c] of q){
      merged.set(n,(merged.get(n)||0)+c);
    }
  }
  return merged;
}

/* ---------- DETERMINISTIC RANDOM ---------- */
function makeSeed(draws){
  let h = 2166136261>>>0;
  for(const d of draws){
    for(const n of d){
      h ^= n;
      h = Math.imul(h,16777619)>>>0;
    }
  }
  return h>>>0;
}

function rng(seed){
  let s=seed>>>0;
  return function(){
    s=(Math.imul(s,1664525)+1013904223)>>>0;
    return s/4294967296;
  };
}

/* ---------- WEIGHTED 40-TICKET GENERATOR ---------- */
/*
Uses the merged 240-position weight inventory as the probability source.
Any qualified follower can combine with any other qualified follower.
*/
function buildWeightedTickets(weights,seed){
  const nums = [...weights.keys()].sort((a,b)=>a-b);
  if(nums.length<6) return null;

  const random = rng(seed^0x9e3779b9);
  const tickets=[];
  const keys=new Set();
  const pairUse=new Map();

  function pairPenalty(candidate,chosen){
    let p=0;
    for(const other of chosen){
      const k = candidate<other ? candidate+"-"+other : other+"-"+candidate;
      p += pairUse.get(k)||0;
    }
    return p;
  }

  function weightedChoice(chosen){
    const candidates = nums.filter(n=>!chosen.includes(n));
    if(!candidates.length) return null;

    const scored = candidates.map(n=>({
      n,
      w:weights.get(n),
      penalty:pairPenalty(n,chosen),
      r:random()
    }));

    /* Prefer high historical weight, but also spread repeated pairings. */
    let total=0;
    const effective = scored.map(x=>{
      const val = x.w / (1 + x.penalty*0.55);
      total += val;
      return {...x,val};
    });

    let r=random()*total;
    for(const x of effective){
      r-=x.val;
      if(r<=0) return x.n;
    }
    return effective[effective.length-1].n;
  }

  let guard=0;

  while(tickets.length<40 && guard<200000){
    guard++;

    const chosen=[];

    while(chosen.length<6){
      const n=weightedChoice(chosen);
      if(n===null) break;
      chosen.push(n);
    }

    if(chosen.length!==6) continue;

    chosen.sort((a,b)=>a-b);
    const key=chosen.join("-");

    if(keys.has(key)) continue;

    keys.add(key);
    tickets.push(chosen);

    for(let i=0;i<chosen.length;i++){
      for(let j=i+1;j<chosen.length;j++){
        const k=chosen[i]+"-"+chosen[j];
        pairUse.set(k,(pairUse.get(k)||0)+1);
      }
    }
  }

  return tickets.length===40 ? tickets : null;
}

/* ---------- MAIN ---------- */
function generate40(){
  const status=document.getElementById("status");
  const latest=document.getElementById("latest");
  const results=document.getElementById("results");
  const grid=document.getElementById("ticketGrid");

  status.textContent="";
  latest.textContent="";
  results.style.display="none";
  grid.innerHTML="";
  generatedTickets=[];

  const draws=parseDraws(document.getElementById("dataInput").value);

  if(draws.length<3){
    status.textContent="Paste at least three valid Lotto Texas drawing rows.";
    return;
  }

  const data=buildFollowerCounters(draws);
  const current=data.current;

  latest.textContent="Latest Draw: "+current.map(fmt).join(" - ");

  let fallbackCount=0;

  for(let pos=0;pos<6;pos++){
    if(data.counters[pos].size===0){
      fillMissingFollowerCounter(
        data.counters[pos],
        data.chronological,
        pos,
        current[pos]
      );
      fallbackCount++;
    }
  }

  if(data.counters.some(c=>c.size===0)){
    status.textContent="Not enough usable historical Lotto Texas data to build all six positions.";
    return;
  }

  const rowQuotas=data.counters.map(allocateForty);
  const merged=mergeQuotas(rowQuotas);
  const tickets=buildWeightedTickets(merged,makeSeed(draws));

  if(!tickets){
    status.textContent="Could not create 40 unique Lotto Texas tickets from this pasted history.";
    return;
  }

  generatedTickets=tickets;

  grid.innerHTML=tickets.map((t,i)=>
    `<div class="ticket">${String(i+1).padStart(2,"0")}. ${t.map(fmt).join(" - ")}</div>`
  ).join("");

  results.style.display="block";

  status.textContent = fallbackCount===0
    ? "40 Lotto Texas tickets generated from exact bottom-up followers."
    : "40 Lotto Texas tickets generated. "+fallbackCount+" position(s) used nearest same-position history because no exact follower existed.";
}

/* ---------- COPY ---------- */
function copyNumbers(){
  if(generatedTickets.length!==40){
    document.getElementById("status").textContent="Generate the 40 numbers first.";
    return;
  }

  const text=generatedTickets.map((t,i)=>
    String(i+1).padStart(2,"0")+". "+t.map(fmt).join(" - ")
  ).join("\n");

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>document.getElementById("status").textContent="40 Lotto Texas numbers copied.")
      .catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
  document.getElementById("status").textContent="40 Lotto Texas numbers copied.";
}

function clearAll(){
  document.getElementById("dataInput").value="";
  document.getElementById("status").textContent="";
  document.getElementById("latest").textContent="";
  document.getElementById("ticketGrid").innerHTML="";
  document.getElementById("results").style.display="none";
  generatedTickets=[];
}

function fmt(n){
  return String(n).padStart(2,"0");
}
</script>
</body>
</html>
