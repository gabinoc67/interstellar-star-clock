<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shapes & Lines Tracing</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#eef9ff;
    color:#111;
}

.app{
    max-width:1000px;
    margin:auto;
}

header,.student,.work{
    background:#fff;
    border-radius:18px;
}

header{
    border:4px solid #168fe5;
    padding:10px;
    text-align:center;
}

h1{
    margin:0;
    font-size:36px;
}

.student{
    margin-top:10px;
    padding:10px;
    border:3px solid #8bd3ff;
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    font-weight:bold;
}

.student input{
    padding:8px;
    border:2px solid #8bd3ff;
    border-radius:8px;
    font-size:16px;
}

.selector{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.shape{
    min-height:44px;
    border:2px solid #168fe5;
    border-radius:10px;
    background:#fff;
    font-weight:bold;
    cursor:pointer;
}

.shape.active{
    background:#168fe5;
    color:#fff;
}

.work{
    margin-top:10px;
    padding:14px;
    border:4px solid #168fe5;
}

#title{
    text-align:center;
    margin:0 0 10px;
    font-size:34px;
}

.trace{
    position:relative;
    width:760px;
    max-width:100%;
    height:470px;
    margin:auto;
    background:#fff;
    border:4px solid #ffc83d;
    border-radius:18px;
    overflow:hidden;
    touch-action:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#guide{
    z-index:1;
    pointer-events:none;
}

#draw{
    z-index:2;
    touch-action:none;
    cursor:crosshair;
}

.tools,.controls{
    margin-top:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-weight:bold;
}

.color{
    width:38px;
    height:38px;
    border-radius:50%;
    border:4px solid #fff;
    outline:2px solid #777;
    cursor:pointer;
}

.color.active{
    outline:4px solid #111;
}

.black{background:#111}
.blue{background:#168fe5}
.red{background:#ef4242}
.green{background:#18a95b}
.purple{background:#8d4bc5}

.control{
    padding:12px 18px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.prev{background:#7655cc}
.clear{background:#ef4242}
.toggle{background:#ed8b12}
.next{background:#18a95b}

#progress{
    text-align:center;
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
}

.note{
    margin-top:10px;
    padding:10px;
    text-align:center;
    background:#fff7c7;
    border:2px solid #e7c329;
    border-radius:10px;
    font-weight:bold;
}

.print-help{
    margin-top:8px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
    color:#333;
}

@media(max-width:760px){
    .selector{
        grid-template-columns:repeat(4,1fr);
    }

    .trace{
        height:400px;
    }
}

@media(max-width:500px){
    .selector{
        grid-template-columns:repeat(2,1fr);
    }

    .trace{
        height:340px;
    }
}

/*
   PRINT CURRENT PAGE ONLY.
   There is no special print page.
   The browser prints the page that is currently displayed.
*/
@media print{
    body{
        background:#fff;
    }

    .app{
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="app">

<header>
    <h1>✏️ Shapes & Lines Tracing</h1>
    <p>Trace over the dashed shape or line.</p>
</header>

<div class="student">

    <label>
        Student Name:
        <input
            id="studentName"
            placeholder="Student name">
    </label>

    <label>
        Date:
        <input
            id="studentDate"
            type="date">
    </label>

</div>

<div
    class="selector"
    id="selector">
</div>

<div class="work">

<h2 id="title">
    Trace: Circle
</h2>

<div
    class="trace"
    id="traceBox">

    <canvas id="guide"></canvas>
    <canvas id="draw"></canvas>

</div>

<div class="tools">

    <span>Pencil Size:</span>

    <input
        id="size"
        type="range"
        min="4"
        max="25"
        value="8">

    <span id="sizeText">8</span>

    <span>Pencil Color:</span>

    <button
        class="color black active"
        data-color="#111111"
        aria-label="Black">
    </button>

    <button
        class="color blue"
        data-color="#168fe5"
        aria-label="Blue">
    </button>

    <button
        class="color red"
        data-color="#ef4242"
        aria-label="Red">
    </button>

    <button
        class="color green"
        data-color="#18a95b"
        aria-label="Green">
    </button>

    <button
        class="color purple"
        data-color="#8d4bc5"
        aria-label="Purple">
    </button>

</div>

<div class="controls">

    <button
        class="control prev"
        id="prev"
        type="button">
        ◀ Previous
    </button>

    <button
        class="control clear"
        id="clear"
        type="button">
        🧹 Clear
    </button>

    <button
        class="control toggle"
        id="toggle"
        type="button">
        👁 Hide Guide
    </button>

    <button
        class="control next"
        id="next"
        type="button">
        Next ▶
    </button>

</div>

<div class="print-help">
    🖨 To print your tracing, press <strong>CTRL + P</strong> on your keyboard.
</div>

<div id="progress">
    Shape 1 of 14 — Circle
</div>

<div class="note">
    Trace the gray dashed shape with a mouse, finger, or stylus.
</div>

</div>
</div>

<script>
"use strict";

const ITEMS = [
    ["Circle","circle"],
    ["Square","square"],
    ["Triangle","triangle"],
    ["Rectangle","rectangle"],
    ["Oval","oval"],
    ["Diamond","diamond"],
    ["Star","star"],
    ["Heart","heart"],
    ["Crescent","crescent"],
    ["Semicircle","semicircle"],
    ["Vertical Line","vertical"],
    ["Horizontal Line","horizontal"],
    ["Diagonal /","slash"],
    ["Diagonal \\","backslash"]
];

const guide =
    document.getElementById("guide");

const draw =
    document.getElementById("draw");

const box =
    document.getElementById("traceBox");

const g =
    guide.getContext("2d");

const d =
    draw.getContext("2d");

const selector =
    document.getElementById("selector");

const title =
    document.getElementById("title");

const progress =
    document.getElementById("progress");

const studentDate =
    document.getElementById("studentDate");

const size =
    document.getElementById("size");

const sizeText =
    document.getElementById("sizeText");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const clear =
    document.getElementById("clear");

const toggle =
    document.getElementById("toggle");

let current = 0;

let color =
    "#111111";

let pencil = 8;

let guideVisible = true;

let drawing = false;

let last = null;


/* ==============================
   TODAY'S DATE
============================== */

function today(){

    const t =
        new Date();

    studentDate.value =
        `${t.getFullYear()}-` +
        `${String(t.getMonth()+1).padStart(2,"0")}-` +
        `${String(t.getDate()).padStart(2,"0")}`;
}


/* ==============================
   CANVAS SETUP
============================== */

function setup(c){

    const r =
        c.getBoundingClientRect();

    const scale =
        window.devicePixelRatio || 1;

    c.width =
        Math.round(r.width * scale);

    c.height =
        Math.round(r.height * scale);

    c.getContext("2d").setTransform(
        scale,
        0,
        0,
        scale,
        0,
        0
    );
}


/* ==============================
   CLEAR CANVAS
============================== */

function erase(c){

    const x =
        c.getContext("2d");

    x.save();

    x.setTransform(
        1,0,0,1,0,0
    );

    x.clearRect(
        0,
        0,
        c.width,
        c.height
    );

    x.restore();
}


/* ==============================
   SHAPE PATHS
============================== */

function shapePath(
    ctx,
    type,
    w,
    h
){

    const sx =
        w / 760;

    const sy =
        h / 470;

    ctx.save();

    ctx.scale(
        sx,
        sy
    );

    ctx.beginPath();


    if(type === "circle"){

        ctx.arc(
            380,
            235,
            145,
            0,
            Math.PI * 2
        );

    }

    else if(type === "square"){

        ctx.rect(
            235,
            90,
            290,
            290
        );

    }

    else if(type === "triangle"){

        ctx.moveTo(
            380,
            70
        );

        ctx.lineTo(
            550,
            380
        );

        ctx.lineTo(
            210,
            380
        );

        ctx.closePath();

    }

    else if(type === "rectangle"){

        ctx.rect(
            170,
            130,
            420,
            210
        );

    }

    else if(type === "oval"){

        ctx.ellipse(
            380,
            235,
            210,
            125,
            0,
            0,
            Math.PI * 2
        );

    }

    else if(type === "diamond"){

        ctx.moveTo(
            380,
            55
        );

        ctx.lineTo(
            570,
            235
        );

        ctx.lineTo(
            380,
            415
        );

        ctx.lineTo(
            190,
            235
        );

        ctx.closePath();

    }

    else if(type === "star"){

        for(
            let i = 0;
            i < 10;
            i++
        ){

            const r =
                i % 2
                    ? 78
                    : 175;

            const a =
                -Math.PI / 2 +
                i * Math.PI / 5;

            const x =
                380 +
                Math.cos(a) * r;

            const y =
                235 +
                Math.sin(a) * r;

            if(i){

                ctx.lineTo(
                    x,
                    y
                );

            }else{

                ctx.moveTo(
                    x,
                    y
                );

            }
        }

        ctx.closePath();

    }

    else if(type === "heart"){

        ctx.moveTo(
            380,
            390
        );

        ctx.bezierCurveTo(
            330,345,
            190,260,
            190,165
        );

        ctx.bezierCurveTo(
            190,80,
            300,65,
            380,155
        );

        ctx.bezierCurveTo(
            460,65,
            570,80,
            570,165
        );

        ctx.bezierCurveTo(
            570,260,
            430,345,
            380,390
        );

        ctx.closePath();

    }

    else if(type === "crescent"){

        ctx.moveTo(
            455,
            80
        );

        ctx.bezierCurveTo(
            290,90,
            245,320,
            405,395
        );

        ctx.bezierCurveTo(
            260,380,
            195,250,
            230,145
        );

        ctx.bezierCurveTo(
            270,30,
            390,30,
            455,80
        );

        ctx.closePath();

    }

    else if(type === "semicircle"){

        ctx.moveTo(
            180,
            330
        );

        ctx.arc(
            380,
            330,
            200,
            Math.PI,
            0
        );

        ctx.lineTo(
            180,
            330
        );

        ctx.closePath();

    }

    else if(type === "vertical"){

        ctx.moveTo(
            380,
            70
        );

        ctx.lineTo(
            380,
            400
        );

    }

    else if(type === "horizontal"){

        ctx.moveTo(
            150,
            235
        );

        ctx.lineTo(
            610,
            235
        );

    }

    else if(type === "slash"){

        ctx.moveTo(
            275,
            390
        );

        ctx.lineTo(
            485,
            80
        );

    }

    else{

        ctx.moveTo(
            275,
            80
        );

        ctx.lineTo(
            485,
            390
        );
    }

    ctx.restore();
}


/* ==============================
   DRAW GUIDE
============================== */

function showGuide(){

    erase(guide);

    if(!guideVisible){
        return;
    }

    const r =
        guide.getBoundingClientRect();

    g.save();

    g.strokeStyle =
        "#777";

    g.lineWidth =
        10;

    g.lineCap =
        "round";

    g.lineJoin =
        "round";

    g.setLineDash(
        [16,14]
    );

    shapePath(
        g,
        ITEMS[current][1],
        r.width,
        r.height
    );

    g.stroke();

    g.restore();
}


/* ==============================
   UPDATE SCREEN
============================== */

function update(){

    title.textContent =
        "Trace: " +
        ITEMS[current][0];

    progress.textContent =
        `Shape ${current + 1} of ${ITEMS.length} — ${ITEMS[current][0]}`;

    document
        .querySelectorAll(".shape")
        .forEach(
            (b,i) => {

                b.classList.toggle(
                    "active",
                    i === current
                );

            }
        );

    showGuide();
}


/* ==============================
   SELECT SHAPE
============================== */

function choose(i){

    current =
        (i + ITEMS.length) %
        ITEMS.length;

    erase(draw);

    update();
}


/* ==============================
   CREATE SHAPE BUTTONS
============================== */

ITEMS.forEach(
    (item,i) => {

        const b =
            document.createElement(
                "button"
            );

        b.type =
            "button";

        b.className =
            "shape";

        b.textContent =
            item[0];

        b.addEventListener(
            "click",
            () => choose(i)
        );

        selector.appendChild(
            b
        );
    }
);


/* ==============================
   POINTER POSITION
============================== */

function point(e){

    const r =
        draw.getBoundingClientRect();

    return {
        x:
            e.clientX -
            r.left,

        y:
            e.clientY -
            r.top
    };
}


/* ==============================
   START DRAWING
============================== */

draw.addEventListener(
    "pointerdown",
    e => {

        if(
            e.pointerType === "mouse" &&
            e.button !== 0
        ){
            return;
        }

        e.preventDefault();

        drawing = true;

        last =
            point(e);

        try{

            draw.setPointerCapture(
                e.pointerId
            );

        }catch(error){}
    }
);


/* ==============================
   DRAW
============================== */

draw.addEventListener(
    "pointermove",
    e => {

        if(!drawing){
            return;
        }

        e.preventDefault();

        const p =
            point(e);

        d.beginPath();

        d.moveTo(
            last.x,
            last.y
        );

        d.lineTo(
            p.x,
            p.y
        );

        d.strokeStyle =
            color;

        d.lineWidth =
            pencil;

        d.lineCap =
            "round";

        d.lineJoin =
            "round";

        d.stroke();

        last =
            p;
    }
);


/* ==============================
   STOP DRAWING
============================== */

function stopDrawing(){

    drawing = false;

    last = null;
}

draw.addEventListener(
    "pointerup",
    stopDrawing
);

draw.addEventListener(
    "pointercancel",
    stopDrawing
);

draw.addEventListener(
    "pointerleave",
    e => {

        if(
            e.buttons === 0
        ){
            stopDrawing();
        }
    }
);


/* ==============================
   PREVIOUS / NEXT
============================== */

prev.addEventListener(
    "click",
    () => choose(
        current - 1
    )
);

next.addEventListener(
    "click",
    () => choose(
        current + 1
    )
);


/* ==============================
   CLEAR
============================== */

clear.addEventListener(
    "click",
    () => erase(draw)
);


/* ==============================
   SHOW / HIDE GUIDE
============================== */

toggle.addEventListener(
    "click",
    () => {

        guideVisible =
            !guideVisible;

        toggle.textContent =
            guideVisible
                ? "👁 Hide Guide"
                : "👁 Show Guide";

        showGuide();
    }
);


/* ==============================
   PENCIL SIZE
============================== */

size.addEventListener(
    "input",
    e => {

        pencil =
            Number(
                e.target.value
            );

        sizeText.textContent =
            pencil;
    }
);


/* ==============================
   COLORS
============================== */

document
    .querySelectorAll(".color")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    color =
                        button.dataset.color;

                    document
                        .querySelectorAll(".color")
                        .forEach(
                            b => b.classList.remove(
                                "active"
                            )
                        );

                    button.classList.add(
                        "active"
                    );
                }
            );
        }
    );


/* ==============================
   START PROGRAM
============================== */

today();

requestAnimationFrame(
    () => {

        setup(guide);

        setup(draw);

        update();
    }
);

</script>

</body>
</html>
