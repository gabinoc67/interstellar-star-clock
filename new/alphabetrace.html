<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Trace the Alphabet A-Z</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4fbff;
    color: #111;
    overscroll-behavior: none;
}

body {
    padding: 12px;
}

.app {
    width: min(1400px, 100%);
    margin: 0 auto;
}

/* =========================
   HEADER
========================= */

.header {
    background: white;
    border: 5px solid #169ce8;
    border-radius: 24px;
    padding: 12px 18px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
}

.header h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 52px);
}

.header p {
    margin: 6px 0 0;
    font-size: clamp(16px, 2vw, 23px);
    font-weight: bold;
}

/* =========================
   ALPHABET BUTTONS
========================= */

.alphabet-selector {
    margin-top: 12px;
    background: white;
    border: 3px solid #169ce8;
    border-radius: 18px;
    padding: 10px;

    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 7px;
}

.letter-button {
    min-height: 50px;

    border: 2px solid #169ce8;
    border-radius: 12px;

    background: #eaf8ff;

    font-size: clamp(15px, 1.6vw, 21px);
    font-weight: 900;

    cursor: pointer;
    touch-action: manipulation;
}

.letter-button:hover {
    background: #d4f1ff;
}

.letter-button.active {
    background: #169ce8;
    color: white;
    border-color: #0877b8;
}

.letter-button:active {
    transform: scale(.96);
}

/* =========================
   WORK AREA
========================= */

.workspace {
    margin-top: 12px;

    background: white;

    border: 5px solid #169ce8;
    border-radius: 24px;

    padding: 14px;

    box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.current-title {
    text-align: center;

    margin: 0 0 10px;

    font-size: clamp(28px, 3.5vw, 46px);
}

/* =========================
   TRACE AREAS
========================= */

.trace-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.trace-card {
    position: relative;

    height: min(54vh, 520px);
    min-height: 340px;

    background: #fff;

    border: 4px solid #ccc;
    border-radius: 22px;

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

.trace-card.upper {
    border-color: #ff4f93;
}

.trace-card.lower {
    border-color: #27b7ef;
}

.card-label {
    position: absolute;

    top: 10px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: clamp(18px, 2vw, 26px);
    font-weight: 900;

    z-index: 4;

    pointer-events: none;
}

/* =========================
   CANVAS
========================= */

.guide-canvas,
.draw-canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}

.guide-canvas {
    z-index: 1;
    pointer-events: none;
}

.draw-canvas {
    z-index: 2;

    cursor: crosshair;

    touch-action: none;
}

/* =========================
   CONTROL BUTTONS
========================= */

.controls {
    margin-top: 14px;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: center;

    gap: 10px;
}

.control-button {
    min-height: 58px;

    padding: 10px 22px;

    border: 0;
    border-radius: 15px;

    color: white;

    font-size: clamp(18px, 2vw, 25px);
    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;

    box-shadow: 0 3px 6px rgba(0,0,0,.15);
}

.control-button:active {
    transform: scale(.96);
}

.previous {
    background: #7b61d1;
}

.clear {
    background: #f04444;
}

.next {
    background: #18a957;
}

.guide-toggle {
    background: #ec8c19;
}

/* =========================
   PENCIL SETTINGS
========================= */

.settings {
    margin-top: 12px;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: center;

    gap: 12px;

    background: white;

    border: 2px solid #bfe8ff;
    border-radius: 15px;

    padding: 10px;
}

.settings label,
.settings span {
    font-size: 18px;
    font-weight: bold;
}

#lineWidth {
    width: 180px;
}

.color-choice {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 4px solid white;
    outline: 2px solid #999;

    cursor: pointer;

    touch-action: manipulation;
}

.color-choice.selected {
    outline: 4px solid #111;
}

.black {
    background: #111;
}

.blue {
    background: #168ce0;
}

.red {
    background: #ed3f3f;
}

.green {
    background: #16a85c;
}

.purple {
    background: #8c4bc4;
}

/* =========================
   PROGRESS
========================= */

.progress {
    margin-top: 10px;

    text-align: center;

    font-size: 19px;
    font-weight: bold;
}

/* =========================
   INSTRUCTIONS
========================= */

.instructions {
    margin-top: 12px;

    background: #fff9cf;

    border: 2px solid #f0cc30;
    border-radius: 14px;

    padding: 10px 15px;

    text-align: center;

    font-size: 17px;
    font-weight: bold;
}

/* =========================
   TABLETS
========================= */

@media (max-width: 900px) {

    .alphabet-selector {
        grid-template-columns: repeat(7, 1fr);
    }

    .trace-grid {
        grid-template-columns: 1fr;
    }

    .trace-card {
        height: 390px;
    }
}

/* =========================
   PHONES
========================= */

@media (max-width: 520px) {

    body {
        padding: 6px;
    }

    .alphabet-selector {
        grid-template-columns: repeat(5, 1fr);
    }

    .letter-button {
        min-height: 46px;
    }

    .trace-card {
        min-height: 310px;
        height: 330px;
    }

    .control-button {
        flex: 1 1 45%;
        padding: 8px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <h1>
            ✏️ Trace the Alphabet A–Z
        </h1>

        <p>
            Use your finger, stylus, touchscreen, or mouse
            to trace the letters.
        </p>

    </header>


    <!-- A-Z BUTTONS -->

    <div
        class="alphabet-selector"
        id="alphabetSelector">
    </div>


    <!-- MAIN WORKSPACE -->

    <main class="workspace">

        <h2
            class="current-title"
            id="currentTitle">
            Trace: A a
        </h2>


        <!-- TRACE CARDS -->

        <div class="trace-grid">


            <!-- UPPERCASE -->

            <section
                class="trace-card upper"
                id="upperCard">

                <div class="card-label">
                    Uppercase
                </div>

                <canvas
                    class="guide-canvas"
                    id="upperGuide">
                </canvas>

                <canvas
                    class="draw-canvas"
                    id="upperDraw">
                </canvas>

            </section>


            <!-- LOWERCASE -->

            <section
                class="trace-card lower"
                id="lowerCard">

                <div class="card-label">
                    Lowercase
                </div>

                <canvas
                    class="guide-canvas"
                    id="lowerGuide">
                </canvas>

                <canvas
                    class="draw-canvas"
                    id="lowerDraw">
                </canvas>

            </section>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button
                type="button"
                class="control-button previous"
                id="previousButton">

                ◀ Previous

            </button>


            <button
                type="button"
                class="control-button clear"
                id="clearButton">

                🧹 Clear

            </button>


            <button
                type="button"
                class="control-button next"
                id="nextButton">

                Next ▶

            </button>


            <button
                type="button"
                class="control-button guide-toggle"
                id="guideButton">

                👁 Hide Guide

            </button>

        </div>


        <!-- PENCIL SETTINGS -->

        <div class="settings">

            <label for="lineWidth">
                Pencil Size:
            </label>

            <input
                id="lineWidth"
                type="range"
                min="8"
                max="40"
                value="20">


            <span>
                Pencil Color:
            </span>


            <button
                type="button"
                class="color-choice black selected"
                data-color="#111111"
                aria-label="Black pencil">
            </button>


            <button
                type="button"
                class="color-choice blue"
                data-color="#168ce0"
                aria-label="Blue pencil">
            </button>


            <button
                type="button"
                class="color-choice red"
                data-color="#ed3f3f"
                aria-label="Red pencil">
            </button>


            <button
                type="button"
                class="color-choice green"
                data-color="#16a85c"
                aria-label="Green pencil">
            </button>


            <button
                type="button"
                class="color-choice purple"
                data-color="#8c4bc4"
                aria-label="Purple pencil">
            </button>

        </div>


        <!-- PROGRESS -->

        <div
            class="progress"
            id="progress">

            Letter 1 of 26 — Aa

        </div>


        <!-- INSTRUCTIONS -->

        <div class="instructions">

            Trace directly over the dotted letters.
            Press CLEAR to try again or NEXT to
            practice the next letter.

        </div>

    </main>

</div>


<script>

/* =========================================================
   ALPHABET
========================================================= */

const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let currentIndex = 0;

let pencilColor = "#111111";

let pencilWidth = 20;

let guideVisible = true;


/* =========================================================
   ELEMENTS
========================================================= */

const selector =
    document.getElementById(
        "alphabetSelector"
    );

const title =
    document.getElementById(
        "currentTitle"
    );

const progress =
    document.getElementById(
        "progress"
    );


const upperGuide =
    document.getElementById(
        "upperGuide"
    );

const upperDraw =
    document.getElementById(
        "upperDraw"
    );


const lowerGuide =
    document.getElementById(
        "lowerGuide"
    );

const lowerDraw =
    document.getElementById(
        "lowerDraw"
    );


const previousButton =
    document.getElementById(
        "previousButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const clearButton =
    document.getElementById(
        "clearButton"
    );

const guideButton =
    document.getElementById(
        "guideButton"
    );

const lineWidthControl =
    document.getElementById(
        "lineWidth"
    );


/* =========================================================
   CREATE Aa-Zz BUTTONS
========================================================= */

letters.forEach(
    (letter, index) => {

        const button =
            document.createElement(
                "button"
            );

        button.type = "button";

        button.className =
            "letter-button";

        button.textContent =
            letter +
            letter.toLowerCase();


        button.addEventListener(
            "click",
            () => {

                currentIndex = index;

                loadLetter();

            }
        );


        selector.appendChild(
            button
        );

    }
);


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(canvas) {

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.round(
            rect.width * ratio
        );

    canvas.height =
        Math.round(
            rect.height * ratio
        );


    const ctx =
        canvas.getContext("2d");


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    return {

        width: rect.width,

        height: rect.height

    };

}


/* =========================================================
   HANDWRITING GUIDE LINES
========================================================= */

function drawWritingLines(
    ctx,
    width,
    height
) {

    const top =
        height * 0.25;

    const middle =
        height * 0.53;

    const bottom =
        height * 0.82;


    ctx.save();

    ctx.lineWidth = 2;


    /* TOP LINE */

    ctx.strokeStyle =
        "#9bdcff";

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.moveTo(
        25,
        top
    );

    ctx.lineTo(
        width - 25,
        top
    );

    ctx.stroke();


    /* MIDDLE DASHED LINE */

    ctx.strokeStyle =
        "#64bfea";

    ctx.setLineDash(
        [10, 8]
    );


    ctx.beginPath();

    ctx.moveTo(
        25,
        middle
    );

    ctx.lineTo(
        width - 25,
        middle
    );

    ctx.stroke();


    /* BOTTOM LINE */

    ctx.strokeStyle =
        "#169ce8";

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.moveTo(
        25,
        bottom
    );

    ctx.lineTo(
        width - 25,
        bottom
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   DOTTED LETTER GUIDE
========================================================= */

function drawGuide(
    canvas,
    letter
) {

    const size =
        resizeCanvas(canvas);

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        size.width,
        size.height
    );


    if (!guideVisible) {

        return;

    }


    drawWritingLines(
        ctx,
        size.width,
        size.height
    );


    const fontSize =
        Math.min(
            size.height * 0.68,
            size.width * 0.72
        );


    ctx.save();


    ctx.font =
        `900 ${fontSize}px Arial`;


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.lineWidth =
        Math.max(
            4,
            fontSize * 0.025
        );


    ctx.strokeStyle =
        "#777777";


    ctx.setLineDash(
        [
            Math.max(
                3,
                fontSize * 0.018
            ),

            Math.max(
                8,
                fontSize * 0.035
            )
        ]
    );


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.strokeText(
        letter,
        size.width / 2,
        size.height * 0.56
    );


    ctx.restore();

}


/* =========================================================
   CLEAR DRAWING
========================================================= */

function clearDrawingCanvas(
    canvas
) {

    const rect =
        canvas.getBoundingClientRect();

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

}


function clearBoth() {

    clearDrawingCanvas(
        upperDraw
    );

    clearDrawingCanvas(
        lowerDraw
    );

}


/* =========================================================
   DRAWING / TOUCHSCREEN SYSTEM
========================================================= */

function setupDrawing(
    canvas
) {

    let drawing = false;

    let lastX = 0;

    let lastY = 0;


    const ctx =
        canvas.getContext("2d");


    function getPosition(
        event
    ) {

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                event.clientX -
                rect.left,

            y:
                event.clientY -
                rect.top

        };

    }


    function startDrawing(
        event
    ) {

        event.preventDefault();


        drawing = true;


        const position =
            getPosition(
                event
            );


        lastX =
            position.x;

        lastY =
            position.y;


        /* DRAW STARTING DOT */

        ctx.beginPath();

        ctx.fillStyle =
            pencilColor;


        ctx.arc(
            lastX,
            lastY,
            pencilWidth / 2,
            0,
            Math.PI * 2
        );


        ctx.fill();


        if (
            canvas.setPointerCapture
        ) {

            try {

                canvas.setPointerCapture(
                    event.pointerId
                );

            }

            catch (error) {

            }

        }

    }


    function draw(
        event
    ) {

        if (!drawing) {

            return;

        }


        event.preventDefault();


        const position =
            getPosition(
                event
            );


        ctx.beginPath();


        ctx.moveTo(
            lastX,
            lastY
        );


        ctx.lineTo(
            position.x,
            position.y
        );


        ctx.strokeStyle =
            pencilColor;


        ctx.lineWidth =
            pencilWidth;


        ctx.lineCap =
            "round";


        ctx.lineJoin =
            "round";


        ctx.stroke();


        lastX =
            position.x;


        lastY =
            position.y;

    }


    function stopDrawing(
        event
    ) {

        if (!drawing) {

            return;

        }


        drawing = false;


        if (
            event &&
            canvas.releasePointerCapture &&
            canvas.hasPointerCapture &&
            canvas.hasPointerCapture(
                event.pointerId
            )
        ) {

            try {

                canvas.releasePointerCapture(
                    event.pointerId
                );

            }

            catch (error) {

            }

        }

    }


    canvas.addEventListener(
        "pointerdown",
        startDrawing,
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "pointermove",
        draw,
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "pointerup",
        stopDrawing
    );


    canvas.addEventListener(
        "pointercancel",
        stopDrawing
    );


    canvas.addEventListener(
        "pointerleave",
        event => {

            if (
                event.pointerType ===
                "mouse"
            ) {

                stopDrawing(
                    event
                );

            }

        }
    );

}


/* =========================================================
   LOAD LETTER
========================================================= */

function loadLetter() {

    const upper =
        letters[currentIndex];


    const lower =
        upper.toLowerCase();


    title.textContent =
        "Trace: " +
        upper +
        " " +
        lower;


    progress.textContent =
        "Letter " +
        (currentIndex + 1) +
        " of 26 — " +
        upper +
        lower;


    document
        .querySelectorAll(
            ".letter-button"
        )
        .forEach(
            (button, index) => {

                button.classList.toggle(
                    "active",
                    index ===
                    currentIndex
                );

            }
        );


    clearBoth();


    drawGuide(
        upperGuide,
        upper
    );


    drawGuide(
        lowerGuide,
        lower
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

previousButton.addEventListener(
    "click",
    () => {

        currentIndex--;


        if (
            currentIndex < 0
        ) {

            currentIndex = 25;

        }


        loadLetter();

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        currentIndex++;


        if (
            currentIndex > 25
        ) {

            currentIndex = 0;

        }


        loadLetter();

    }
);


/* =========================================================
   CLEAR
========================================================= */

clearButton.addEventListener(
    "click",
    () => {

        clearBoth();

    }
);


/* =========================================================
   SHOW / HIDE GUIDE
========================================================= */

guideButton.addEventListener(
    "click",
    () => {

        guideVisible =
            !guideVisible;


        guideButton.textContent =
            guideVisible
            ? "👁 Hide Guide"
            : "👁 Show Guide";


        drawGuide(
            upperGuide,
            letters[currentIndex]
        );


        drawGuide(
            lowerGuide,
            letters[currentIndex]
                .toLowerCase()
        );

    }
);


/* =========================================================
   PENCIL SIZE
========================================================= */

lineWidthControl.addEventListener(
    "input",
    () => {

        pencilWidth =
            Number(
                lineWidthControl.value
            );

    }
);


/* =========================================================
   PENCIL COLORS
========================================================= */

document
    .querySelectorAll(
        ".color-choice"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    pencilColor =
                        button.dataset.color;


                    document
                        .querySelectorAll(
                            ".color-choice"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );

                }
            );

        }
    );


/* =========================================================
   PREVENT SCREEN MOVEMENT WHILE TRACING
========================================================= */

[
    upperDraw,
    lowerDraw
]
.forEach(
    canvas => {

        canvas.addEventListener(
            "touchmove",
            event => {

                event.preventDefault();

            },
            {
                passive: false
            }
        );

    }
);


/* =========================================================
   RESIZE SCREEN
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    resizeCanvas(
                        upperDraw
                    );

                    resizeCanvas(
                        lowerDraw
                    );


                    loadLetter();

                },
                200
            );

    }
);


/* =========================================================
   START PROGRAM
========================================================= */

resizeCanvas(
    upperDraw
);

resizeCanvas(
    lowerDraw
);


setupDrawing(
    upperDraw
);

setupDrawing(
    lowerDraw
);


loadLetter();

</script>

</body>
</html>
