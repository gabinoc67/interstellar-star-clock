<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Trace the Alphabet A-Z</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4fbff;
        color: #111;
        overscroll-behavior: none;
    }

    body {
        padding: 12px;
    }

    .app {
        width: min(1400px, 100%);
        margin: 0 auto;
    }

    .header {
        background: white;
        border: 5px solid #169ce8;
        border-radius: 24px;
        padding: 12px 18px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }

    .header h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 52px);
    }

    .header p {
        margin: 6px 0 0;
        font-size: clamp(16px, 2vw, 23px);
        font-weight: bold;
    }

    /* A-Z selector */
    .alphabet-selector {
        margin-top: 12px;
        background: white;
        border: 3px solid #169ce8;
        border-radius: 18px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 7px;
    }

    .letter-button {
        min-height: 48px;
        border: 2px solid #169ce8;
        border-radius: 12px;
        background: #eaf8ff;
        font-size: clamp(15px, 1.6vw, 21px);
        font-weight: 900;
        cursor: pointer;
        touch-action: manipulation;
    }

    .letter-button:hover {
        background: #d4f1ff;
    }

    .letter-button.active {
        background: #169ce8;
        color: white;
        border-color: #0877b8;
    }

    .workspace {
        margin-top: 12px;
        background: white;
        border: 5px solid #169ce8;
        border-radius: 24px;
        padding: 14px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .current-title {
        text-align: center;
        margin: 0 0 10px;
        font-size: clamp(26px, 3.5vw, 46px);
    }

    .trace-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .trace-card {
        position: relative;
        height: min(54vh, 520px);
        min-height: 340px;
        background: #fff;
        border: 4px solid #ccc;
        border-radius: 22px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    .trace-card.upper {
        border-color: #ff4f93;
    }

    .trace-card.lower {
        border-color: #27b7ef;
    }

    .card-label {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(18px, 2vw, 26px);
        font-weight: 900;
        z-index: 4;
        pointer-events: none;
    }

    .guide-canvas,
    .draw-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .guide-canvas {
        z-index: 1;
        pointer-events: none;
    }

    .draw-canvas {
        z-index: 2;
        cursor: crosshair;
        touch-action: none;
    }

    .controls {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .control-button {
        min-height: 58px;
        padding: 10px 22px;
        border: 0;
        border-radius: 15px;
        color: white;
        font-size: clamp(18px, 2vw, 25px);
        font-weight: 900;
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: 0 3px 6px rgba(0,0,0,.15);
    }

    .previous {
        background: #7b61d1;
    }

    .clear {
        background: #f04444;
    }

    .next {
        background: #18a957;
    }

    .guide-toggle {
        background: #ec8c19;
    }

    .control-button:active,
    .letter-button:active {
        transform: scale(.97);
    }

    .settings {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px;
        background: white;
        border: 2px solid #bfe8ff;
        border-radius: 15px;
        padding: 10px;
    }

    .settings label {
        font-size: 18px;
        font-weight: bold;
    }

    #lineWidth {
        width: 180px;
    }

    .color-choice {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 4px solid white;
        outline: 2px solid #999;
        cursor: pointer;
        touch-action: manipulation;
    }

    .color-choice.selected {
        outline: 4px solid #111;
    }

    .black { background: #111; }
    .blue  { background: #168ce0; }
    .red   { background: #ed3f3f; }
    .green { background: #16a85c; }
    .purple { background: #8c4bc4; }

    .progress {
        margin-top: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
    }

    .instructions {
        margin-top: 12px;
        background: #fff9cf;
        border: 2px solid #f0cc30;
        border-radius: 14px;
        padding: 10px 15px;
        text-align: center;
        font-size: 17px;
        font-weight: bold;
    }

    @media (max-width: 900px) {
        .alphabet-selector {
            grid-template-columns: repeat(7, 1fr);
        }

        .trace-grid {
            grid-template-columns: 1fr;
        }

        .trace-card {
            height: 390px;
        }
    }

    @media (max-width: 520px) {
        body {
            padding: 6px;
        }

        .alphabet-selector {
            grid-template-columns: repeat(5, 1fr);
        }

        .letter-button {
            min-height: 44px;
        }

        .trace-card {
            min-height: 310px;
            height: 330px;
        }

        .control-button {
            flex: 1 1 45%;
            padding: 8px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>✏️ Trace the Alphabet A–Z</h1>
        <p>Use your finger, stylus, touchscreen, or mouse to trace the letters.</p>
    </header>

    <div class="alphabet-selector" id="alphabetSelector"></div>

    <main class="workspace">

        <h2 class="current-title" id="currentTitle">
            Trace: A a
        </h2>

        <div class="trace-grid">

            <!-- UPPERCASE -->
            <section class="trace-card upper" id="upperCard">
                <div class="card-label">Uppercase</div>
                <canvas class="guide-canvas" id="upperGuide"></canvas>
                <canvas class="draw-canvas" id="upperDraw"></canvas>
            </section>

            <!-- LOWERCASE -->
            <section class="trace-card lower" id="lowerCard">
                <div class="card-label">Lowercase</div>
                <canvas class="guide-canvas" id="lowerGuide"></canvas>
                <canvas class="draw-canvas" id="lowerDraw"></canvas>
            </section>

        </div>

        <div class="controls">

            <button class="control-button previous" id="previousButton">
                ◀ Previous
            </button>

            <button class="control-button clear" id="clearButton">
                🧹 Clear
            </button>

            <button class="control-button next" id="nextButton">
                Next ▶
            </button>

            <button class="control-button guide-toggle" id="guideButton">
                👁 Hide Guide
            </button>

        </div>

        <div class="settings">

            <label for="lineWidth">
                Pencil Size:
            </label>

            <input
                id="lineWidth"
                type="range"
                min="8"
                max="40"
                value="20"
            >

            <span style="font-weight:bold;">Pencil Color:</span>

            <button
                class="color-choice black selected"
                data-color="#111111"
                aria-label="Black pencil">
            </button>

            <button
                class="color-choice blue"
                data-color="#168ce0"
                aria-label="Blue pencil">
            </button>

            <button
                class="color-choice red"
                data-color="#ed3f3f"
                aria-label="Red pencil">
            </button>

            <button
                class="color-choice green"
                data-color="#16a85c"
                aria-label="Green pencil">
            </button>

            <button
                class="color-choice purple"
                data-color="#8c4bc4"
                aria-label="Purple pencil">
            </button>

        </div>

        <div class="progress" id="progress">
            Letter 1 of 26
        </div>

        <div class="instructions">
            Trace directly over the dotted letters. Press CLEAR to try again,
            or NEXT to practice the next letter.
        </div>

    </main>

</div>


<script>
/* =========================================================
   ALPHABET
========================================================= */

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let currentIndex = 0;
let pencilColor = "#111111";
let pencilWidth = 20;
let guideVisible = true;


/* =========================================================
   ELEMENTS
========================================================= */

const selector = document.getElementById("alphabetSelector");
const title = document.getElementById("currentTitle");
const progress = document.getElementById("progress");

const upperGuide = document.getElementById("upperGuide");
const upperDraw = document.getElementById("upperDraw");

const lowerGuide = document.getElementById("lowerGuide");
const lowerDraw = document.getElementById("lowerDraw");

const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const clearButton = document.getElementById("clearButton");
const guideButton = document.getElementById("guideButton");
const lineWidthControl = document.getElementById("lineWidth");


/* =========================================================
   CREATE A-Z BUTTONS
========================================================= */

letters.forEach((letter, index) => {

    const button = document.createElement("button");

    button.className = "letter-button";
    button.textContent = letter + letter.toLowerCase();

    button.addEventListener("click", () => {
        currentIndex = index;
        loadLetter();
    });

    selector.appendChild(button);
});


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(canvas) {

    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);

    const ctx = canvas.getContext("2d");

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    return {
        width: rect.width,
        height: rect.height
    };
}


/* =========================================================
   DRAW HANDWRITING LINES
========================================================= */

function drawWritingLines(ctx, width, height) {

    const top = height * 0.25;
    const middle = height * 0.53;
    const bottom = height * 0.82;

    ctx.save();

    ctx.lineWidth = 2;

    /* Top line */
    ctx.strokeStyle = "#9bdcff";
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(25, top);
    ctx.lineTo(width - 25, top);
    ctx.stroke();

    /* Middle dashed line */
    ctx.strokeStyle = "#64bfea";
    ctx.setLineDash([10, 8]);

    ctx.beginPath();
    ctx.moveTo(25, middle);
    ctx.lineTo(width - 25, middle);
    ctx.stroke();

    /* Bottom line */
    ctx.strokeStyle = "#169ce8";
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(25, bottom);
    ctx.lineTo(width - 25, bottom);
    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   DRAW DOTTED LETTER
========================================================= */

function drawGuide(canvas, letter) {

    const size = resizeCanvas(canvas);
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, size.width, size.height);

    if (!guideVisible) {
        return;
    }

    drawWritingLines(ctx, size.width, size.height);

    const fontSize = Math.min(
        size.height * 0.68,
        size.width * 0.72
    );

    ctx.save();

    ctx.font = `900 ${fontSize}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    /*
       Dotted / dashed outline.
       The browser draws the outline of the letter using dashes.
    */

    ctx.lineWidth = Math.max(4, fontSize * 0.025);
    ctx.strokeStyle = "#8b8b8b";
    ctx.setLineDash([
        Math.max(3, fontSize * 0.018),
        Math.max(8, fontSize * 0.035)
    ]);

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /*
       Move the letter slightly downward to make room
       for the Uppercase/Lowercase label.
    */

    ctx.strokeText(
        letter,
        size.width / 2,
        size.height * 0.56
    );

    ctx.restore();
}


/* =========================================================
   CLEAR DRAWING CANVAS
========================================================= */

function clearDrawingCanvas(canvas) {

    const rect = canvas.getBoundingClientRect();

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );
}


function clearBoth() {

    clearDrawingCanvas(upperDraw);
    clearDrawingCanvas(lowerDraw);
}


/* =========================================================
   SET UP DRAWING
========================================================= */

function setupDrawing(canvas) {

    let drawing = false;
    let lastX = 0;
    let lastY = 0;

    const ctx = canvas.getContext("2d");

    function position(event) {

        const rect = canvas.getBoundingClientRect();

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }


    function startDrawing(event) {

        event.preventDefault();

        drawing = true;

        const p = position(event);

        lastX = p.x;
        lastY = p.y;

        /*
          Draw a dot immediately so tapping the
          screen also leaves a visible mark.
        */

        ctx.beginPath();
        ctx.fillStyle = pencilColor;

        ctx.arc(
            lastX,
            lastY,
            pencilWidth / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        if (canvas.setPointerCapture) {
            try {
                canvas.setPointerCapture(event.pointerId);
            } catch (e) {}
        }
    }


    function draw(event) {

        if (!drawing) return;

        event.preventDefault();

        const p = position(event);

        ctx.beginPath();

        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);

        ctx.strokeStyle = pencilColor;
        ctx.lineWidth = pencilWidth;

        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.stroke();

        lastX = p.x;
        lastY = p.y;
    }


    function stopDrawing(event) {

        if (!drawing) return;

        drawing = false;

        if (event &&
            canvas.releasePointerCapture &&
            canvas.hasPointerCapture &&
            canvas.hasPointerCapture(event.pointerId)) {

            try {
                canvas.releasePointerCapture(event.pointerId);
            } catch (e) {}
        }
    }


    canvas.addEventListener(
        "pointerdown",
        startDrawing,
        { passive: false }
    );

    canvas.addEventListener(
        "pointermove",
        draw,
        { passive: false }
    );

    canvas.addEventListener(
        "pointerup",
        stopDrawing
    );

    canvas.addEventListener(
        "pointercancel",
        stopDrawing
    );

    canvas.addEventListener(
        "pointerleave",
        (event) => {

            /*
              Mouse drawing stops when leaving the canvas.
              Touch/stylus pointer capture continues normally.
            */

            if (event.pointerType === "mouse") {
                stopDrawing(event);
            }
        }
    );
}


/* =========================================================
   LOAD CURRENT LETTER
========================================================= */

function loadLetter() {

    const upper = letters[currentIndex];
    const lower = upper.toLowerCase();

    title.textContent =
        "Trace: " + upper + " " + lower;

    progress.textContent =
        "Letter " +
        (currentIndex + 1) +
        " of 26 — " +
        upper +
        lower;

    /*
       Highlight current alphabet button
    */

    document
        .querySelectorAll(".letter-button")
        .forEach((button, index) => {

            button.classList.toggle(
                "active",
                index === currentIndex
            );
        });

    clearBoth();

    drawGuide(
        upperGuide,
        upper
    );

    drawGuide(
        lowerGuide,
        lower
    );
}


/* =========================================================
   PREVIOUS / NEXT
========================================================= */

previousButton.addEventListener("click", () => {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = 25;
    }

    loadLetter();
});


nextButton.addEventListener("click", () => {

    currentIndex++;

    if (currentIndex > 25) {
        currentIndex = 0;
    }

    loadLetter();
});


/* =========================================================
   CLEAR
========================================================= */

clearButton.addEventListener("click", () => {
    clearBoth();
});


/* =========================================================
   SHOW / HIDE GUIDE
========================================================= */

guideButton.addEventListener("click", () => {

    guideVisible = !guideVisible;

    guideButton.textContent =
        guideVisible
        ? "👁 Hide Guide"
        : "👁 Show Guide";

    drawGuide(
        upperGuide,
        letters[currentIndex]
    );

    drawGuide(
        lowerGuide,
        letters[currentIndex].toLowerCase()
    );
});


/* =========================================================
   PENCIL SIZE
========================================================= */

lineWidthControl.addEventListener("input", () => {

    pencilWidth =
        Number(lineWidthControl.value);
});


/* =========================================================
   PENCIL COLORS
========================================================= */

document
    .querySelectorAll(".color-choice")
    .forEach(button => {

        button.addEventListener("click", () => {

            pencilColor =
                button.dataset.color;

            document
                .querySelectorAll(".color-choice")
                .forEach(item => {
                    item.classList.remove("selected");
                });

            button.classList.add("selected");
        });
    });


/* =========================================================
   PREVENT TOUCH SCROLLING WHILE TRACING
========================================================= */

[upperDraw, lowerDraw].forEach(canvas => {

    canvas.addEventListener(
        "touchmove",
        event => {
            event.preventDefault();
        },
        { passive: false }
    );
});


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer;

window.addEventListener("resize", () => {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {

        /*
          Resizing clears canvas drawings.
          This keeps the guide correctly aligned.
        */

        resizeCanvas(upperDraw);
        resizeCanvas(lowerDraw);

        loadLetter();

    }, 200);
});


/* =========================================================
   START APPLICATION
========================================================= */

resizeCanvas(upperDraw);
resizeCanvas(lowerDraw);

setupDrawing(upperDraw);
setupDrawing(lowerDraw);

loadLetter();

</script>

</body>
</html>
